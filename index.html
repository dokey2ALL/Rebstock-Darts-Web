<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#62000d">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rebstock Darts">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Rebstock Darts · Grundrot & Weiß – HTML-Vorschau</title>
<style>
  :root { color-scheme:dark; --back:#55000c; --red:#9b0b20; --red-light:#ac1028; --ink:#fff9fa; --muted:#f1ced4; }
  * {box-sizing:border-box;}
  html,body {margin:0;width:100%;height:100%;min-height:0;overflow:hidden;overscroll-behavior:none;}
  #app {position:fixed;inset:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;}
  @supports (height:100svh) { #app {height:100svh;} }
  @supports (height:100dvh) { #app {height:100dvh;} }
  body {background:var(--back);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;}
  button {font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
  button:focus-visible {outline:3px solid white;outline-offset:-4px;}
  .screen {width:100%;height:100%;min-height:0;max-height:100%;display:flex;flex-direction:column;position:relative;isolation:isolate;overflow:hidden;overscroll-behavior:none; background:linear-gradient(145deg,#380006 0%,#74000f 34%,#930819 74%,#590009 100%);}
  .screen::before{content:"";position:absolute;z-index:-1;pointer-events:none;width:118%;height:76%;left:-54%;top:26%;border-radius:50%;background:linear-gradient(130deg,rgba(35,0,7,.42),rgba(110,0,15,.08));transform:rotate(11deg);}
  .screen::after{content:"";position:absolute;z-index:-1;pointer-events:none;width:125%;height:53%;right:-65%;bottom:-24%;border-radius:50%;background:linear-gradient(55deg,rgba(41,0,7,.48),rgba(129,0,18,.10));transform:rotate(-20deg);}
  /* Page 1: Startseite. The original reference layout stays intact. */
  .brand {margin:clamp(35px,5.5dvh,80px) clamp(20px,4vw,58px) 0;display:flex;align-items:center;gap:clamp(2px,1.5vw,14px);width:max-content;max-width:calc(100% - 36px);}
  .brand-mark {height:clamp(69px,12.8dvh,120px);width:clamp(85px,14dvh,135px);object-fit:contain;flex:none;filter:drop-shadow(0 1px 1px #31000933);}
  .brand-text {display:flex;flex-direction:column;white-space:nowrap;line-height:1;gap:4px;}
  .brand-text .brand-first{font-size:clamp(21px,5.35vw,38px);font-weight:760;letter-spacing:.3px;}
  .brand-text .brand-last{font-size:clamp(24px,6vw,43px);font-weight:820;letter-spacing:1.4px;color:#fc1537;}
  .home-menu{margin:auto 0 clamp(24px,4.5dvh,72px);width:100%;align-self:stretch;display:flex;flex-direction:column;gap:2px;}
  .menu-item{position:relative;display:grid;grid-template-columns:clamp(53px,11vw,92px) minmax(0,1fr) 48px;align-items:center;gap:clamp(9px,2.6vw,18px);width:100%;height:clamp(77px,11.1dvh,98px);padding:0 clamp(20px,4.4vw,50px);border:0;color:#fff;background:linear-gradient(90deg,rgba(178,15,39,.63),rgba(131,4,21,.75));text-align:left;border-top:1px solid #d2223d2b;border-bottom:1px solid #49000a60;}
  .menu-item:active{background:linear-gradient(90deg,#c7193b,#980720);}
  .menu-icon{width:clamp(37px,6vw,53px);height:clamp(37px,6vw,53px);stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;fill:none;}
  .menu-copy{min-width:0;display:flex;flex-direction:column;gap:3px;}
  .menu-copy strong{font-size:clamp(15px,3.65vw,25px);line-height:1.08;font-weight:820;letter-spacing:.1px;}
  .menu-copy small{font-size:clamp(11px,2.8vw,17px);color:var(--muted);line-height:1.3;white-space:normal;}
  .menu-chevron{justify-self:end;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:#67000d75;}
  .menu-chevron svg{height:22px;width:22px;fill:none;stroke:white;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;}
  /* V15: EVENTS – fifth home menu item, compact enough to keep the homepage fixed. */
  .home-menu .menu-item{height:clamp(65px,9dvh,84px);}
  .menu-item.events-entry{
    background:linear-gradient(92deg,rgba(198,15,44,.92),rgba(136,0,26,.96));
    border-top:1px solid rgba(255,125,140,.45);
    border-bottom:1px solid rgba(70,0,10,.76);
  }
  .menu-item.events-entry::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:clamp(5px,.75vw,9px);
    background:#ff2338;box-shadow:2px 0 13px rgba(255,41,62,.32);
  }
  .menu-item.events-entry .menu-chevron{background:#62000de8;}
  .menu-item.events-entry:active{background:linear-gradient(90deg,#e11a37,#9a0020);}
  @media(max-width:360px){.home-menu .menu-item{height:clamp(55px,10.6dvh,70px);}}
  @media(max-height:650px){.home-menu .menu-item{height:clamp(45px,10.9dvh,67px);}}
  @media(max-height:370px){.home-menu .menu-item{height:clamp(36px,11.9dvh,49px);}}

  /* Events: a real full-screen destination, with a scrollable content pane only if necessary. */
  .events-body{
    flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;
    padding:clamp(16px,3.2dvh,32px) clamp(14px,4vw,50px) calc(20px + env(safe-area-inset-bottom));
  }
  .events-content{width:min(100%,980px);margin:0 auto;display:flex;flex-direction:column;gap:clamp(20px,3dvh,28px);}
  .events-group h2{margin:0 0 11px;font-size:clamp(15px,2.9vw,21px);font-weight:850;letter-spacing:.5px;text-transform:uppercase;color:#fff1f3;}
  .events-past{
    position:relative;overflow:hidden;
    color:#dde2e8;padding:clamp(13px,2dvh,18px) 16px;
    background:
      linear-gradient(145deg,rgba(40,44,50,.58) 0%,rgba(23,26,31,.72) 48%,rgba(14,16,20,.82) 100%),
      linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.012));
    border:1px solid rgba(255,255,255,.10);
    border-left:4px solid rgba(148,154,164,.55);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.09), inset 0 -1px 0 rgba(255,255,255,.025), 0 10px 24px rgba(0,0,0,.16);
    backdrop-filter:blur(10px) saturate(112%);
    -webkit-backdrop-filter:blur(10px) saturate(112%);
    font-size:clamp(14px,2.7vw,17px);min-height:48px;
  }
  .events-past::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(180deg,rgba(255,255,255,.09),transparent 28%,transparent 72%,rgba(255,255,255,.03));
    opacity:.9;
  }
  .events-list{display:grid;grid-template-columns:1fr;gap:clamp(12px,2dvh,20px);}
  .event-tile{
    position:relative;min-width:0;display:flex;flex-direction:column;gap:0;
    background:linear-gradient(125deg,rgba(153,20,43,.85),rgba(76,0,17,.96));
    border:1px solid rgba(255,210,219,.25);border-left:0;
    padding:clamp(15px,2.5vw,25px) clamp(15px,3vw,30px) clamp(15px,2.5vw,25px) clamp(22px,3.1vw,34px);
    box-shadow:0 8px 22px rgba(25,0,5,.14);
  }
  .event-tile::before{content:"";position:absolute;top:0;bottom:0;left:0;width:6px;background:#ff1e3a;}
  /* Rebstock Darts League: Farbwelt bleibt erhalten, aber als eigenständige Flächenvariante. */
  .event-tile.event-rebstock{
    isolation:isolate;
    min-height:clamp(148px,23vw,186px);
    background:
      linear-gradient(180deg,rgba(112,5,24,.84),rgba(63,0,13,.96)),
      radial-gradient(120% 100% at 15% 14%,rgba(255,255,255,.11),transparent 38%),
      linear-gradient(145deg,#93132f 0%,#670619 54%,#41000d 100%);
    border:1px solid rgba(255,209,219,.23);
    box-shadow:0 10px 24px rgba(29,0,8,.22), inset 0 1px 0 rgba(255,255,255,.10);
    overflow:hidden;
  }
  .event-tile.event-rebstock::before{
    content:"";position:absolute;top:0;bottom:0;left:0;width:6px;
    background:linear-gradient(180deg,#ff2646 0%,#ff667f 100%);
    box-shadow:2px 0 13px rgba(255,47,79,.32);
  }
  .event-tile.event-rebstock::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:
      linear-gradient(116deg,rgba(255,255,255,.055) 0 7%,transparent 7.2% 62%,rgba(255,255,255,.03) 62.2% 70%,transparent 70.2%),
      linear-gradient(180deg,rgba(255,255,255,.035),transparent 24%,transparent 76%,rgba(0,0,0,.08));
    opacity:.95;
  }
  .event-tile.event-rebstock .event-kicker,
  .event-tile.event-rebstock .event-title,
  .event-tile.event-rebstock .event-subtitle,
  .event-tile.event-rebstock .event-date,
  .event-tile.event-rebstock .event-time,
  .event-tile.event-rebstock .event-rule,
  .event-tile.event-rebby .event-kicker,
  .event-tile.event-rebby .event-title,
  .event-tile.event-rebby .event-subtitle,
  .event-tile.event-rebby .event-date,
  .event-tile.event-rebby .event-time,
  .event-tile.event-rebby .event-rule{position:relative;z-index:1;}
  .event-tile.event-rebstock .event-kicker{color:#ffe7ed;letter-spacing:1.3px;}
  .event-tile.event-rebstock .event-title{color:#ffffff;font-size:clamp(22px,4.6vw,30px);text-shadow:0 2px 8px rgba(0,0,0,.26);}
  .event-tile.event-rebstock .event-subtitle{color:#ffe1e7;font-weight:760;}
  .event-tile.event-rebstock .event-rule{background:linear-gradient(90deg,rgba(255,218,226,.62),rgba(255,218,226,.12));}
  .event-tile.event-rebstock .event-date{color:#fff7f8;font-weight:880;}
  .event-tile.event-rebstock .event-time{color:#ffd2da;font-weight:760;}

  /* Rebby Pally: angelehnt an PDC/Scoreboard-Look – rauer, dunkler, mit sehr dünnen diagonalen Linien. */
  .event-tile.event-rebby{
    isolation:isolate;
    min-height:clamp(152px,24vw,192px);
    background:
      linear-gradient(180deg,rgba(5,10,22,.80),rgba(2,6,15,.94)),
      radial-gradient(130% 120% at 18% 18%,rgba(255,255,255,.13),transparent 42%),
      radial-gradient(110% 100% at 86% 10%,rgba(56,110,255,.20),transparent 30%),
      radial-gradient(120% 95% at 10% 2%,rgba(197,36,255,.18),transparent 26%),
      linear-gradient(135deg,#1c2432 0%,#101723 46%,#090f19 100%);
    border:1px solid rgba(255,255,255,.22);
    box-shadow:0 12px 26px rgba(6,10,22,.30), inset 0 1px 0 rgba(255,255,255,.10);
    overflow:hidden;
  }
  .event-tile.event-rebby::before{
    content:"";position:absolute;top:0;bottom:0;left:0;width:6px;
    background:linear-gradient(180deg,#4fa2ff 0%,#c930ff 100%);
    box-shadow:2px 0 14px rgba(120,88,255,.35);
  }
  .event-tile.event-rebby::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:
      repeating-linear-gradient(128deg,rgba(255,255,255,.05) 0 1px,transparent 1px 24px),
      repeating-linear-gradient(128deg,rgba(203,88,255,.09) 8px 9px,transparent 9px 30px),
      repeating-linear-gradient(128deg,rgba(255,255,255,.03) 17px 18px,transparent 18px 36px),
      radial-gradient(140% 110% at 15% 16%,rgba(255,255,255,.08),transparent 36%),
      linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.02)),
      radial-gradient(circle at 12% 20%,rgba(255,255,255,.08) 0 .8px,transparent 1.1px),
      radial-gradient(circle at 76% 35%,rgba(255,255,255,.05) 0 .8px,transparent 1.1px),
      radial-gradient(circle at 58% 72%,rgba(255,255,255,.045) 0 .8px,transparent 1.1px),
      radial-gradient(circle at 31% 84%,rgba(255,255,255,.04) 0 .8px,transparent 1.1px);
    background-size:auto,auto,auto,auto,auto,160px 120px,210px 150px,180px 140px,150px 120px;
    mix-blend-mode:screen;
    opacity:.92;
  }
  .event-tile.event-rebby .event-kicker{
    color:#eaf0ff;
    letter-spacing:1.4px;
    text-shadow:0 1px 6px rgba(0,0,0,.25);
  }
  .event-tile.event-rebby .event-title{
    color:#ffffff;
    font-size:clamp(22px,4.7vw,31px);
    text-shadow:0 2px 10px rgba(0,0,0,.34);
  }
  .event-tile.event-rebby .event-subtitle{color:#c9f0c9;font-weight:760;}
  .event-tile.event-rebby .event-rule{background:linear-gradient(90deg,rgba(255,255,255,.42),rgba(255,255,255,.08));}
  .event-tile.event-rebby .event-date{color:#ffffff;font-weight:880;}
  .event-tile.event-rebby .event-time{color:#d7e3f6;font-weight:760;}

  .event-tile.event-link{color:inherit;font:inherit;text-align:left;cursor:pointer;appearance:none;width:100%;border-radius:0;touch-action:manipulation;}
  .event-tile.event-link:active{filter:brightness(1.12);}
  .event-tile.event-link:focus-visible{outline:3px solid #ffe1e5;outline-offset:-4px;}
  .event-tile.event-link .event-title::after{content:'›';font-size:.85em;position:absolute;right:clamp(15px,2vw,25px);color:#ffd8df;}
  .event-tile.event-link .event-title{padding-right:18px;}
  .event-preview{width:min(100%,670px);margin:auto;align-self:center;padding:clamp(20px,4vw,34px);background:rgba(62,0,12,.55);border:1px solid #eea0b044;border-left:5px solid #ff1e3a;}
  .event-preview .event-kicker{display:block;margin-bottom:12px;}
  .event-preview h2{margin:0 0 8px;font-size:clamp(24px,4vw,36px);}
  .event-preview .event-subtitle{margin-bottom:15px;}
  .event-preview .event-date{margin:16px 0 0;}
  .event-preview p{margin:18px 0 0;line-height:1.55;color:#ffdae1;font-size:clamp(14px,2.9vw,17px);}
  .event-detail-body{flex:1;min-height:0;display:flex;overflow-y:auto;padding:clamp(12px,3vw,32px);}

  .event-kicker{font-size:clamp(10px,2vw,13px);letter-spacing:1.25px;color:#ffc1cc;font-weight:850;}
  .event-title{font-size:clamp(20px,4.5vw,29px);font-weight:850;line-height:1.1;margin:10px 0 3px;overflow-wrap:break-word;}
  .event-subtitle{font-size:clamp(14px,3.3vw,20px);font-weight:720;line-height:1.3;color:#ffe5e9;}
  .event-rule{height:1px;width:100%;background:linear-gradient(90deg,rgba(255,207,214,.7),rgba(255,207,214,.12));margin:clamp(15px,2.2dvh,22px) 0 clamp(12px,2dvh,18px);}
  .event-date{font-size:clamp(13px,2.6vw,17px);font-weight:850;letter-spacing:.55px;line-height:1.35;}
  .event-time{font-size:clamp(14px,2.8vw,18px);margin-top:4px;font-weight:650;color:#ffd8df;}
  @media(min-width:750px) and (orientation:landscape){
    .events-content{gap:clamp(14px,2.5dvh,24px);}
    .events-list{grid-template-columns:repeat(2,minmax(0,1fr));}
  }
  @media(max-height:630px){
    .events-body{padding-top:12px;}
    .events-content{gap:13px;}
    .event-tile{padding-top:11px;padding-bottom:11px;}
    .event-title{margin-top:6px;}
    .event-rule{margin:10px 0;}
  }

  /* V17 tournament stage chooser and fixed-rule pages. */
  .tourney-scroll {flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:clamp(12px,2.4dvh,25px) clamp(12px,3.4vw,42px);}
  .tourney-wrap {max-width:1050px;width:100%;margin:0 auto;}
  .tourney-head {margin-bottom:clamp(14px,2.5dvh,25px);}
  .tourney-head h2 {font-size:clamp(23px,4.8vw,36px);margin:5px 0 3px;color:#fff;line-height:1.15;}
  .tourney-head p {font-size:clamp(12px,2.6vw,16px);margin:5px 0 0;color:#f8d4dc;}
  .tourney-grid {display:grid;grid-template-columns:1fr;gap:clamp(9px,1.5dvh,16px);}
  .tourney-phase {width:100%;border:1px solid #dd87974d;border-left:5px solid #ff253e;background:linear-gradient(95deg,rgba(160,12,40,.85),rgba(69,0,16,.8));padding:clamp(12px,2.1dvh,21px) clamp(35px,4vw,35px) clamp(12px,2.1dvh,21px) 15px;text-align:left;color:#fff;display:flex;flex-direction:column;gap:3px;position:relative;}
  .tourney-phase:active {background:#a10829;}
  .tourney-phase-label {font-size:clamp(16px,3.2vw,21px);font-weight:850;letter-spacing:.5px;}
  .tourney-phase strong {font-size:clamp(13px,2.5vw,17px);font-weight:750;}
  .tourney-phase-length {font-size:clamp(13px,2.7vw,17px);font-weight:800;color:#ffbfc8;}
  .tourney-phase-desc {font-size:clamp(11px,2.2vw,14px);line-height:1.25;color:#f3d6dc;margin-top:2px;}
  .tourney-phase-arrow {position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:30px;}
  .tourney-hint {font-size:12px;line-height:1.4;color:#ffcbcf;margin:16px 0 0;}
  .tourney-detail {max-width:650px;}
  .tourney-settings {border:1px solid #eb9faa4d;background:#45000e9c;display:grid;grid-template-columns:1fr 1fr;gap:0;}
  .tourney-settings>div {padding:clamp(15px,2.8vw,21px);border-bottom:1px solid #eb9faa2a;border-right:1px solid #eb9faa2a;display:flex;flex-direction:column;gap:6px;}
  .tourney-settings span,.tourney-consequence>span {color:#f5b7c2;font-size:11px;font-weight:800;letter-spacing:.7px;}
  .tourney-settings strong {font-size:clamp(17px,3.1vw,23px);line-height:1.2;}
  .tourney-consequence,.tourney-rest-info {margin-top:15px;background:#5d0618a8;border-left:4px solid #f92745;padding:clamp(13px,2vw,19px);}
  .tourney-consequence p {margin:7px 0 0;font-size:clamp(14px,2.6vw,17px);line-height:1.45;}
  .tourney-rest-info {font-size:clamp(12px,2.2vw,15px);line-height:1.45;background:#3b000ca8;}
  .tourney-footer {padding:12px max(14px,calc((100% - 650px)/2)) calc(13px + env(safe-area-inset-bottom));background:#3b0009b0;flex:none;}
  .tourney-footer button {min-height:52px;width:100%;}
  .tourney-selected-tag {display:inline-block;margin:0 0 8px;padding:5px 10px;background:#ac1434;font-size:12px;font-weight:850;letter-spacing:.2px;}
  .tourney-rest-summary {margin-top:12px;padding:12px 10px;background:#42000d7d;border:1px solid #d884924d;}
  .tourney-rest-summary h3 {margin:0 0 8px;font-size:clamp(14px,2.5vw,19px);}
  .tourney-rest-summary p {font-size:12px;color:#f0cbd2;line-height:1.35;margin:8px 0 0;}
  .tourney-rest-table {border-collapse:collapse;width:100%;font-size:clamp(11px,2.4vw,15px);font-variant-numeric:tabular-nums;}
  .tourney-rest-table th,.tourney-rest-table td {padding:7px 5px;text-align:right;border-bottom:1px solid #ce839044;white-space:nowrap;}
  .tourney-rest-table th:first-child,.tourney-rest-table td:first-child {text-align:left;}
  .tourney-rest-table th {color:#ffb7c4;font-weight:850;}
  .tourney-rest-table tfoot {color:#fff;font-weight:850;background:#8c102c7c;}
  .tourney-rest-inline {display:flex;justify-content:space-between;gap:12px;background:#720b204c;padding:7px 10px;font-size:12px;}
  @media (min-width:700px) and (orientation:landscape) { .tourney-grid {grid-template-columns:repeat(2,minmax(0,1fr));} }
  @media (max-height:625px) { .tourney-phase {padding-top:9px;padding-bottom:9px;} .tourney-head {margin-bottom:10px;} }

  /* A new full page opens for each menu choice. No accordion or submenu on the home screen. */
  .page-top {display:flex;align-items:center;gap:10px;min-height:70px;padding:calc(9px + env(safe-area-inset-top)) clamp(14px,3vw,30px) 10px;border-bottom:1px solid #f6b5c033;background:#63000db5;}
  .back {flex:none;display:grid;place-items:center;width:48px;height:48px;border:0;border-radius:9px;background:rgba(255,255,255,.12);color:white;font-size:33px;line-height:1;}
  .page-top h1{font-size:clamp(19px,3vw,26px);line-height:1.1;margin:0;font-weight:800;}
  .page-body{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:clamp(9px,3dvh,26px);overflow:hidden;}
  .placeholder{width:min(100%,480px);max-height:100%;overflow:hidden;background:#4b000c7d;border:1px solid #d9788866;padding:clamp(22px,4vw,34px);border-radius:14px;text-align:center;box-shadow:0 14px 48px #17000544;}
  .placeholder .mark{font-size:48px;margin:0 0 16px;}
  .placeholder h2{font-size:clamp(21px,3.3vw,28px);margin:0 0 10px;}
  .placeholder p{font-size:15px;color:#f5d3db;line-height:1.5;margin:0 0 24px;}
  .back-main{color:white;background:#a4142f;border:1px solid #e96c82;padding:15px 20px;border-radius:7px;font-weight:800;min-height:50px;}
  @media(min-width:700px) and (orientation:landscape){
    .brand{margin-top:clamp(30px,5dvh,65px);margin-left:clamp(30px,5vw,80px);}
    .brand-mark{height:clamp(85px,15dvh,125px);width:clamp(105px,17dvh,135px);}

  /* Page 2: Match beginnen – next confirmed step, still a full separate page. */
  .flow-top {position:relative;justify-content:center;flex:0 0 auto;min-height:clamp(58px,9dvh,79px);padding:8px clamp(16px,4vw,48px);background:#57000996;border-bottom:1px solid #ed6d8330;}

  .mode-icon {width:clamp(34px,5vw,52px);height:clamp(34px,5vw,52px);stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round;}
  .mode-copy {display:flex;flex-direction:column;gap:5px;min-width:0;}

  /* Page 3 – X01: fully interactive configuration prototype, no gameplay yet. */
  .x01-main {width:100%;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:clamp(10px,2.2dvh,28px) clamp(14px,3.3vw,46px);}
  .x01-form {width:min(100%,640px);height:auto;max-height:100%;display:grid;grid-template-columns:minmax(0,1fr);gap:clamp(8px,1.55dvh,14px);align-content:center;}
  .x01-block {min-width:0;display:flex;flex-direction:column;gap:clamp(5px,.8dvh,8px);}
  .x01-title {font-size:clamp(12px,2.8vw,17px);font-weight:800;color:#fff4f5;letter-spacing:.25px;line-height:1.15;}
  .x01-subtitle {font-size:clamp(10px,2.2vw,13px);font-weight:550;color:#ecc6cc;line-height:1.3;}
  .x01-segments {width:100%;min-width:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));min-height:clamp(37px,5.7dvh,51px);gap:3px;padding:3px;border:1px solid #fdb7c24f;background:#42000d8f;border-radius:7px;}
  .x01-segments.two {grid-template-columns:repeat(2,minmax(0,1fr));}
  .x01-choice {min-width:0;min-height:0;line-height:1.14;padding:4px 3px;background:#ffffff12;color:#ffe0e5;border:0;border-radius:4px;font-size:clamp(10.5px,2.8vw,15px);font-weight:750;white-space:normal;}
  .x01-choice[aria-pressed="true"] {background:linear-gradient(180deg,#cb2845,#990c27);color:white;box-shadow:0 0 0 1px #f1a6b55c inset;}
  .x01-choice:not([aria-pressed="true"]):active {background:#ffffff30;}
  .x01-counts {background:#4b000c85;border:1px solid #eeb6c329;border-radius:7px;padding:clamp(6px,1.1dvh,12px) clamp(10px,2.7vw,16px);display:flex;flex-direction:column;gap:8px;}

  .x01-stepper button {display:grid;place-items:center;width:clamp(31px,5.5dvh,42px);height:clamp(31px,5.5dvh,42px);border-radius:5px;background:#e3bac5;color:#590317;border:1px solid #ffffff45;font-size:25px;font-weight:850;line-height:1;padding:0;}
  .x01-stepper button:disabled {opacity:.3;cursor:default;}
  .x01-value {min-width:29px;font-size:clamp(17px,3.9vw,25px);font-weight:850;text-align:center;font-variant-numeric:tabular-nums;}
  .x01-next {width:100%;height:clamp(48px,7dvh,58px);border:1px solid #f09eac7d;border-radius:4px;background:linear-gradient(180deg,#b51b36,#8a0820);color:white;font-size:clamp(15px,3.5vw,20px);font-weight:850;letter-spacing:.35px;}
  .x01-next:active {background:#d32a48;}
  .x01-footer {display:flex;flex-direction:column;gap:6px;}

  @media (orientation:landscape) and (min-width:620px) {
    .x01-form {width:min(100%,1030px);grid-template-columns:repeat(2,minmax(0,1fr));column-gap:clamp(16px,3.4vw,36px);row-gap:clamp(8px,1.8dvh,18px);}

  /* Page 4 – ordered player selection, profile tiles and add-player control.
     The full viewport never scrolls; only the player list can scroll if it grows. */
  .p4-main {flex:1;min-height:0;width:100%;display:flex;justify-content:center;padding:clamp(8px,1.7dvh,17px) clamp(12px,3vw,30px) 3px;overflow:hidden;}
  .p4-layout {width:min(100%,1040px);height:100%;min-height:0;display:grid;grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto;gap:clamp(7px,1.5dvh,14px);}
  .p4-selection {display:flex;flex-direction:column;min-height:0;overflow:hidden;}

  /* Seite 6 / Match-Statistiken – Überarbeitung nach Freigabe */

  /* V8: Matchkopf und Leg-Ende – klarer, kompakter und ohne Zurueck-Pfeil. */

  .g-round{display:flex;flex-direction:column;gap:3px;flex-shrink:0;font-size:clamp(10px,1.5vw,15px);line-height:1.12;font-weight:900;color:#471321;white-space:nowrap;}
  .g-head-divider{display:block;align-self:stretch;min-height:34px;width:1px;flex-shrink:0;background:#c7aeb5;}
  .g-wincondition{font-size:clamp(9px,1.55vw,14px);line-height:1.2;font-weight:800;color:#7a1b35;max-width:155px;overflow-wrap:break-word;}
  .g-center{justify-self:center;}
  .g-center .g-title{font-size:clamp(22px,4.9vw,38px);}
  .g-center .g-sub{font-size:clamp(8px,1.55vw,14px);}
  .g-finish-kicker{font-size:clamp(12px,2.75vw,16px);color:#795260;letter-spacing:.15px;font-weight:650;line-height:1.3;margin:4px 0 9px;}
  .g-hint .g-result-sub{font-size:clamp(14px,3.4vw,19px);font-weight:500;line-height:1.4;margin:8px 0;}
  .g-winner-name{color:#8b1d37;font-weight:850;background:#f8e8ed;padding:2px 5px;border-radius:3px;}
  .g-stand{margin-top:18px;}
  /* Sofortige Rueckmeldung beim Druecken, danach 140 ms Nachleuchten. */
  .g-key{touch-action:manipulation;transition:background-color 65ms ease,color 65ms ease;}
  .g-key:active:not(:disabled),.g-key.g-pressing:not(:disabled),
  .g-key.g-flash:not(:disabled){background:#ba506b!important;color:#fff!important;}
  .g-key.g-special:active:not(:disabled),.g-key.g-special.g-pressing:not(:disabled),
  .g-key.g-special.g-flash:not(:disabled){background:#7c1b36!important;color:#fff!important;}
  @media (max-width:420px){
    .g-top{padding:0 7px;gap:4px;}
    .g-head-left{gap:5px;}
    .g-round{font-size:clamp(9px,2.4vw,12px);}
    .g-wincondition{font-size:clamp(8px,2.1vw,11px);max-width:82px;}
    .g-head-divider{min-height:29px;}
    .g-center .g-title{font-size:clamp(21px,6.3vw,29px);}
    .g-center .g-sub{font-size:clamp(8px,2.1vw,10px);}
    .g-settings{width:30px;height:35px;font-size:23px;}
    .g-live{font-size:9px;}
  }
  @media(max-height:480px){
    .g-round{font-size:clamp(8px,2.1dvh,12px);}
    .g-wincondition{font-size:clamp(8px,2dvh,11px);}
    .g-head-divider{min-height:24px;}
    .g-finish-kicker{margin:1px 0 4px;}
    .g-stand{margin-top:6px;}
  }

  /* V9: Kompakte Matchzahlen, einklappbare Set- und Leg-Einzelauswertungen. */
  .summary-head{min-height:45px;padding:7px clamp(11px,2.6vw,20px);}
  .summary-head strong{font-size:clamp(16px,3.2vw,22px);}
  .summary-body{padding:clamp(6px,1.2dvh,11px);display:flex;flex-direction:column;gap:7px;}
  .summary-winner{padding:8px 10px;margin:0;min-height:42px;border-left-width:4px;}
  .summary-winner strong{font-size:clamp(15px,3vw,20px);}
  .summary-winner span{font-size:clamp(10px,2.25vw,13px);}
  .summary-tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:5px;flex:0 0 auto;}
  .summary-tabs button{background:#eee2e6;border:1px solid #d7bdc5;color:#671a32;padding:clamp(8px,1.4dvh,12px) 3px;font-size:clamp(11px,2.6vw,14px);font-weight:850;}
  .summary-tabs button.active{background:#8f1936;color:#fff;border-color:#8f1936;}
  .summary-content{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:1px 1px 6px;}
  .summary-grid{grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:7px;}
  .summary-player{padding:8px 9px;border:1px solid #e2d3d7;background:#fff;min-width:0;}
  .summary-player-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px;min-width:0;}
  .summary-player-head strong{font-size:clamp(13px,2.9vw,18px);color:#62162b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .summary-player-head span{flex-shrink:0;color:#7b0d2c;font-weight:900;font-size:clamp(14px,3vw,18px);font-variant-numeric:tabular-nums;}
  .summary-numbers{grid-template-columns:repeat(4,minmax(0,1fr));gap:3px;}
  .summary-metric{padding:6px 2px;gap:4px;min-width:0;}
  .summary-metric small{font-size:clamp(8px,1.8vw,10px);line-height:1.2;}
  .summary-metric b{font-size:clamp(12px,2.5vw,17px);line-height:1.1;}
  .summary-extra{margin-top:5px;text-align:right;font-size:clamp(10px,2vw,12px);color:#765864;}
  .summary-note{font-size:clamp(10px,2vw,12px);margin:2px 0 0;flex:0 0 auto;line-height:1.3;}
  .summary-footer{flex:0 0 auto;padding:6px clamp(6px,1.3vw,12px) calc(6px + env(safe-area-inset-bottom));}
  .summary-footer button{padding:clamp(9px,1.7dvh,12px) 2px;font-size:clamp(10px,2.3vw,14px);}
  .summary-detail{border:1px solid #dfcbd1;background:#fff;margin-bottom:5px;}
  .summary-detail summary{display:grid;grid-template-columns:auto minmax(0,1fr) 19px;gap:9px;align-items:center;list-style:none;cursor:pointer;padding:10px 9px;}
  .summary-detail summary::-webkit-details-marker{display:none;}
  .summary-detail summary>span:first-child{color:#6c152d;font-weight:900;font-size:clamp(12px,2.6vw,15px);white-space:nowrap;}
  .summary-detail summary small{text-align:right;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:clamp(10px,2vw,13px);color:#76505d;}
  .summary-caret{font-size:18px;color:#8f1936;transform:rotate(0);transition:transform .13s;}
  .summary-detail[open] .summary-caret{transform:rotate(180deg);}
  .summary-detail-players{padding:5px 7px 7px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,245px),1fr));gap:6px;background:#f5eff0;}
  @media(max-height:540px){
    .summary-head{min-height:36px;padding:5px 11px;}
    .summary-winner{min-height:33px;padding:5px 8px;}
    .summary-tabs button{padding:6px 3px;}
    .summary-detail summary{padding:7px 9px;}
    .summary-footer{padding-top:4px;}
    .summary-footer button{padding:7px 2px;}
    .summary-note{display:none;}
  }

  /* Seite 7 – Spieler verwalten / Spielerprofil. Gleiche klare rote Referenzoptik. */
  .pm-main{flex:1;min-height:0;display:flex;justify-content:center;padding:clamp(10px,2dvh,19px) clamp(10px,3vw,28px) clamp(10px,2dvh,18px);overflow:hidden;}
  .pm-column{width:min(100%,740px);height:100%;min-height:0;display:flex;flex-direction:column;gap:clamp(9px,1.6dvh,15px);}
  .pm-label{font-size:clamp(13px,2.8vw,17px);font-weight:850;letter-spacing:.35px;margin:0;}
  .pm-sub{font-size:clamp(11px,2.5vw,14px);color:#f0c7d2;margin:3px 0 0;line-height:1.36;}
  .pm-add-panel{background:#7f071bb5;border:1px solid #e1647e55;flex:none;}
  .pm-add-head{width:100%;min-height:clamp(58px,9dvh,78px);display:grid;grid-template-columns:clamp(31px,6.5vw,43px) 1fr auto;align-items:center;gap:clamp(8px,2vw,17px);border:0;background:transparent;color:white;text-align:left;padding:10px clamp(12px,3vw,21px);font-weight:850;font-size:clamp(13px,3vw,18px);}
  .pm-add-head svg{width:clamp(25px,4.7vw,34px);height:clamp(25px,4.7vw,34px);stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .pm-expand{font-size:24px;line-height:1;color:#ffe1e7;}
  .pm-add-body{padding:0 clamp(12px,3vw,21px) clamp(12px,2dvh,17px);}
  .pm-add-form{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;}
  .pm-input{font:inherit;color:#351019;background:#fff8fa;border:1px solid #dc929f;border-radius:3px;min-width:0;min-height:48px;padding:0 12px;font-size:16px;}
  .pm-input::placeholder{color:#99717a;}
  .pm-input:focus-visible{outline:3px solid #ffbccb;outline-offset:1px;}
  .pm-save{background:#39000b;color:white;border:1px solid #d05e72;padding:0 clamp(10px,2.5vw,19px);min-height:48px;font-weight:850;font-size:clamp(12px,2.7vw,15px);border-radius:3px;}
  .pm-feedback{font-size:12px;margin:7px 0 0;line-height:1.35;color:#fff2f4;}
  .pm-list-header{display:flex;justify-content:space-between;gap:8px;align-items:end;padding:0 2px;flex:none;}
  .pm-count{font-weight:700;font-size:clamp(11px,2.4vw,14px);color:#f5c8d2;}
  .pm-list{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:4px;padding-bottom:5px;scrollbar-width:thin;scrollbar-color:#db6375 #55000c;}
  .pm-player{width:100%;display:grid;grid-template-columns:clamp(43px,7.5vw,56px) minmax(0,1fr) 24px;gap:clamp(10px,2vw,18px);align-items:center;padding:clamp(8px,1.4dvh,13px) clamp(13px,2.7vw,22px);min-height:clamp(57px,9.8dvh,78px);color:#fff;border:1px solid #eba9b53c;background:linear-gradient(90deg,#ad1e37bb,#7d061ac9);text-align:left;border-radius:2px;flex-shrink:0;}
  .pm-player:active{background:#c22340;}
  .pm-avatar{width:clamp(41px,7vw,55px);height:clamp(41px,7vw,55px);display:grid;place-items:center;border-radius:50%;background:#e7a7b650;color:#fff;font-weight:850;font-size:clamp(14px,3vw,19px);}
  .pm-person{display:flex;flex-direction:column;gap:3px;min-width:0;}
  .pm-person strong{font-weight:820;font-size:clamp(16px,3.6vw,21px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .pm-person small{font-size:clamp(10px,2.4vw,13px);color:#f5c4cd;}
  .pm-chevron{font-size:28px;line-height:1;justify-self:center;font-weight:600;}
  .pm-note{margin:0;flex:none;font-size:clamp(10px,2.4vw,12px);color:#f0bec9;line-height:1.35;}
  .pm-profile{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:clamp(10px,2dvh,17px);padding-bottom:10px;scrollbar-width:thin;}
  .pm-profile-heading{display:flex;gap:14px;align-items:center;flex:none;padding:clamp(13px,2dvh,22px);border:1px solid #f5c5cb57;background:#8f0a23bd;}
  .pm-big-avatar{width:clamp(62px,13vw,85px);height:clamp(62px,13vw,85px);border-radius:50%;background:#eac0c851;display:grid;place-items:center;font-weight:850;font-size:clamp(20px,4vw,31px);flex:none;}
  .pm-profile-heading h2{margin:0;font-size:clamp(18px,4vw,29px);overflow-wrap:anywhere;line-height:1.15;}
  .pm-profile-heading small{display:block;margin-top:4px;color:#f3bec8;font-size:12px;}
  .pm-rename{background:#660014aa;border:1px solid #e8a7b84d;padding:clamp(11px,2.1dvh,17px);flex:none;}
  .pm-rename label{display:block;font-weight:850;font-size:clamp(12px,2.8vw,15px);margin-bottom:9px;}
  .pm-metric-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;flex:none;}
  .pm-metric{background:linear-gradient(120deg,#8e1328,#630013);border:1px solid #f0a7b83d;padding:clamp(11px,1.8dvh,17px) 13px;min-width:0;display:flex;flex-direction:column;gap:6px;}
  .pm-metric.wide{grid-column:1/-1;}
  .pm-metric span{color:#f4c8d1;font-weight:720;font-size:clamp(11px,2.4vw,13px);}
  .pm-metric strong{font-weight:900;font-size:clamp(23px,5.5vw,34px);font-variant-numeric:tabular-nums;}
  .pm-last{background:#73091cb5;border:1px solid #f3b6bf40;padding:clamp(11px,2dvh,17px);}
  .pm-last h3{font-size:clamp(13px,2.8vw,17px);font-weight:850;margin:0 0 9px;}
  .pm-last-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:8px 0;border-top:1px solid #f6c5cd26;font-size:clamp(11px,2.7vw,14px);}
  .pm-last-row span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .pm-last-row b{color:#fff2f4;}
  /* V11 – Spielerprofil entfernen: bewusste Zweischritt-Bestätigung. */
  .pm-delete-section{grid-column:1/-1;display:flex;flex-direction:column;align-items:stretch;gap:7px;flex:none;margin-top:2px;}
  .pm-delete-trigger{background:transparent;border:1px solid #ef9eae8b;color:#ffe1e7;min-height:45px;padding:10px 14px;font-size:clamp(12px,2.6vw,15px);font-weight:800;letter-spacing:.2px;text-align:center;border-radius:3px;}
  .pm-delete-trigger:active{background:#a7233e88;}
  .pm-confirm-backdrop{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:clamp(15px,4vw,28px);background:rgba(23,0,7,.78);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);}
  .pm-confirm-dialog{width:min(100%,410px);background:#fff9fa;color:#300b14;border:1px solid #edc5cd;border-radius:8px;padding:clamp(20px,5vw,29px);box-shadow:0 24px 70px #180006ad;text-align:center;}
  .pm-confirm-dialog h2{font-size:clamp(18px,4.4vw,23px);font-weight:850;line-height:1.35;overflow-wrap:anywhere;margin:0 0 10px;}
  .pm-confirm-dialog p{font-size:clamp(12px,3vw,14px);color:#71525c;line-height:1.5;margin:0 0 20px;}
  .pm-confirm-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}
  .pm-confirm-actions button{border-radius:4px;min-height:49px;font-size:clamp(14px,3.2vw,17px);font-weight:900;letter-spacing:.4px;}
  .pm-confirm-no{background:#eee7e9;border:1px solid #cab4ba;color:#40202a;}
  .pm-confirm-yes{background:#bf1435;border:1px solid #d62849;color:#fff;}
  .pm-confirm-yes:active{background:#920d27;}
  .pm-confirm-backdrop button:focus-visible,.pm-delete-trigger:focus-visible{outline:3px solid #f092a5;outline-offset:2px;}
  @media(min-width:700px) and (orientation:landscape){
    .pm-column{width:min(100%,850px);}
    .pm-profile{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-auto-rows:max-content;align-content:start;gap:13px 20px;}
    .pm-profile-heading{grid-column:1;grid-row:1;}
    .pm-rename{grid-column:1;grid-row:2;}
    .pm-metric-grid{grid-column:2;grid-row:1/span 2;align-self:start;}
    .pm-last{grid-column:1/-1;}
  }
  @media(max-height:640px){
    .pm-main{padding-top:6px;padding-bottom:5px;}
    .pm-column{gap:6px;}
    .pm-add-head{min-height:45px;padding-top:5px;padding-bottom:5px;}
    .pm-player{min-height:43px;padding-top:4px;padding-bottom:4px;}
    .pm-avatar{width:34px;height:34px;}
    .pm-profile-heading{padding:9px;}
    .pm-metric{padding:7px 11px;gap:3px;}
    .pm-metric strong{font-size:22px;}
  }


/* V12: Statistiken als eigenständige, bildschirmfüllende Seiten. */
.rb-stats-body {flex:1;min-height:0;display:flex;justify-content:center;padding:clamp(16px,3dvh,28px) clamp(12px,3vw,30px);overflow:hidden;}
.rb-stats-col {width:min(100%,860px);display:flex;flex-direction:column;min-height:0;gap:clamp(12px,2dvh,18px);}
.rb-stats-kicker {font-size:clamp(13px,2.8vw,17px);font-weight:850;letter-spacing:.55px;color:#ffeaed;margin:0 2px 4px;}
.rb-stats-hub {padding-top:clamp(35px,9dvh,95px);}
.rb-hub-link {width:100%;border:1px solid #ec9bab66;border-radius:2px;background:linear-gradient(90deg,#a61732c8,#74051bbc);color:#fff;padding:clamp(14px,2.4dvh,23px);min-height:clamp(92px,14dvh,121px);display:grid;grid-template-columns:clamp(36px,7vw,52px) minmax(0,1fr) 25px;align-items:center;gap:clamp(10px,2.2vw,20px);text-align:left;}
.rb-hub-link:active {background:#c12544;}
.rb-hub-icon {height:clamp(30px,5.2vw,43px);width:clamp(30px,5.2vw,43px);stroke:#fff;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;fill:none;}
.rb-hub-copy {display:flex;flex-direction:column;gap:4px;min-width:0;}
.rb-hub-copy strong {font-size:clamp(16px,3.4vw,22px);line-height:1.2;font-weight:850;}
.rb-hub-copy small {font-size:clamp(12px,2.6vw,15px);color:#ffced8;line-height:1.35;}
.rb-hub-arr {font-size:30px;line-height:1;justify-self:end;}
.rb-stats-desc {color:#f5c4ce;font-size:clamp(11px,2.35vw,14px);line-height:1.4;margin:0 2px;}
.rb-stats-head {display:flex;justify-content:space-between;align-items:end;gap:12px;flex:none;}
.rb-stats-head div {min-width:0;}
.rb-stats-head p {margin:4px 0 0;color:#ffd7df;font-size:clamp(12px,2.4vw,15px);line-height:1.35;}
.rb-stats-count {flex:none;background:#55000d;color:#ffdde4;border:1px solid #db6d858a;padding:6px 10px;font-size:clamp(11px,2.2vw,13px);font-weight:800;}
.rb-data-scroll {flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#e0778b #55000c;display:flex;flex-direction:column;gap:7px;padding:2px 1px 8px;}
.rb-stats-person {width:100%;flex:none;min-height:104px;border:1px solid #f8bbc166;background:linear-gradient(90deg,#a01936,#750718);color:#fff;display:grid;grid-template-columns:clamp(42px,8vw,55px) minmax(0,1fr) 20px;align-items:start;gap:12px;padding:clamp(11px,2vw,17px);text-align:left;}
.rb-stats-person:active {background:#b6213e;}
.rb-stats-avatar {width:clamp(40px,7.2vw,54px);height:clamp(40px,7.2vw,54px);border-radius:50%;display:grid;place-items:center;background:#e49caa6b;font-size:clamp(14px,2.6vw,18px);font-weight:850;}
.rb-stats-person-main {min-width:0;display:flex;flex-direction:column;gap:8px;}
.rb-stats-person-main strong {font-size:clamp(15px,3.15vw,20px);line-height:1.14;overflow-wrap:anywhere;}
.rb-stats-metrics {display:flex;gap:5px 14px;flex-wrap:wrap;align-items:baseline;font-size:clamp(11px,2.2vw,13px);line-height:1.3;color:#f9d0d8;}
.rb-stats-metrics b {color:white;font-variant-numeric:tabular-nums;}
.rb-stats-person-arr {font-size:27px;align-self:center;}
.rb-stats-note {font-size:clamp(10px,2vw,12px);line-height:1.35;color:#eec3cd;flex:none;margin:0;}
.rb-results-card {border:1px solid #e7a7b766;background:#820d24c9;color:#fff;padding:clamp(12px,2vw,17px);flex:none;display:flex;flex-direction:column;gap:9px;}
.rb-results-top {display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap;}
.rb-results-date {font-size:clamp(11px,2.2vw,13px);font-weight:730;color:#f5c9d4;}
.rb-results-type {font-size:clamp(10px,2.1vw,12px);font-weight:800;color:#fce0e7;border:1px solid #e4a2b063;padding:3px 7px;}
.rb-results-winner {font-size:clamp(17px,3.5vw,21px);font-weight:850;line-height:1.2;overflow-wrap:anywhere;}
.rb-results-winner svg {width:19px;height:19px;vertical-align:-3px;fill:none;stroke:#f6d0da;stroke-width:2;}
.rb-results-scores {display:flex;gap:5px 12px;flex-wrap:wrap;}
.rb-results-score {font-size:clamp(12px,2.35vw,15px);color:#f7e0e5;padding:5px 10px;background:#52000e78;border:1px solid #e3a4b335;}
.rb-results-score b {color:#fff;font-weight:900;}
.rb-stats-empty {padding:25px 18px;background:#640116aa;border:1px solid #e9a1b55c;text-align:center;font-size:clamp(13px,2.5vw,16px);line-height:1.6;color:#f9dce2;}
@media(min-width:750px) and (orientation:landscape) {
 .rb-stats-hub {padding-top:clamp(35px,8dvh,90px);}
 .rb-hub-link {min-height:clamp(85px,16dvh,114px);}
 .rb-data-scroll {display:grid;align-content:start;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}
 .rb-stats-person {min-height:clamp(110px,20dvh,145px);}
 .rb-results-card {min-height:118px;}
}
@media(max-height:550px) and (orientation:landscape) {
 .rb-stats-body {padding:8px 14px;}
 .rb-stats-hub {padding-top:8px;}
 .rb-hub-link {min-height:68px;padding:9px 14px;}
 .rb-stats-col {gap:9px;}
}


/* V13: Statistik-Detail bewusst getrennt vom bearbeitbaren Spielerprofil. */
.rb-stat-detail-body {flex:1;min-height:0;overflow:hidden;display:flex;justify-content:center;padding:clamp(11px,2.2dvh,24px) clamp(12px,3vw,30px);}
.rb-stat-detail-col {width:min(100%,850px);min-height:0;display:flex;flex-direction:column;gap:clamp(10px,1.8dvh,16px);}
.rb-stat-detail-title {flex:none;padding:clamp(12px,2.3dvh,22px) clamp(14px,3vw,24px);background:linear-gradient(90deg,#880d26,#630517);border-left:4px solid #ec9fae;}
.rb-stat-detail-title small {display:block;letter-spacing:1.35px;color:#f7cbd2;font-size:clamp(10px,2vw,12px);font-weight:800;}
.rb-stat-detail-title h2 {font-size:clamp(22px,4.2vw,32px);line-height:1.12;color:white;margin:6px 0 0;overflow-wrap:anywhere;}
.rb-stat-detail-title p {color:#f9cbd6;font-size:clamp(11px,2.25vw,13px);margin:7px 0 0;}
.rb-stat-detail-scroll {flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;display:flex;flex-direction:column;gap:12px;padding:1px 1px 10px;}
.rb-stat-detail-section {border:1px solid #e9a4b356;background:#740820bc;padding:clamp(12px,2.4vw,20px);}
.rb-stat-detail-section h3 {font-size:clamp(12px,2.4vw,16px);font-weight:900;letter-spacing:.45px;margin:0 0 12px;color:#fff1f3;}
.rb-stat-detail-grid {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;}
.rb-stat-detail-value {background:#41000f98;padding:10px 7px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;min-height:68px;}
.rb-stat-detail-value span {color:#efc7d1;font-size:clamp(10px,2vw,12px);}
.rb-stat-detail-value strong {color:#fff;font-size:clamp(19px,4vw,27px);font-weight:850;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;}
.rb-stat-detail-match {display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 12px;padding:10px 2px;border-top:1px solid #db87904a;font-size:clamp(11px,2.25vw,14px);}
.rb-stat-detail-match:first-of-type {border-top:0;}
.rb-stat-detail-match .who {color:white;font-weight:750;overflow-wrap:anywhere;}
.rb-stat-detail-match .date {color:#edb5c2;font-size:11px;}
.rb-stat-detail-match .result {font-weight:850;align-self:center;grid-column:2;grid-row:1 / 3;white-space:nowrap;color:#fff;}
.rb-stat-detail-note {margin:0;color:#f0c2cc;font-size:clamp(11px,2vw,12px);line-height:1.45;}
@media (min-width:750px) and (orientation:landscape){
 .rb-stat-detail-col {width:min(100%,1000px);}
 .rb-stat-detail-scroll {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:max-content;align-content:start;gap:14px;}
 .rb-stat-detail-note {grid-column:1/-1;}
}
@media (max-height:520px) and (orientation:landscape){.rb-stat-detail-body {padding:6px 13px;}.rb-stat-detail-title {padding:8px 15px;}.rb-stat-detail-title h2 {font-size:22px;}.rb-stat-detail-value {min-height:55px;padding:6px;}}



/* V14: separate settings page, non-destructive match defaults. */
.rb-options-body {flex:1;min-height:0;overflow:hidden;display:flex;justify-content:center;padding:clamp(8px,1.7dvh,17px) clamp(12px,3.2vw,40px);}
.rb-options-layout {width:min(100%,1060px);min-height:0;height:100%;display:flex;flex-direction:column;gap:clamp(8px,1.2dvh,12px);overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;}
.rb-options-card {flex:0 0 auto;padding:clamp(12px,2.3dvh,21px);background:linear-gradient(110deg,rgba(125,5,27,.74),rgba(78,0,13,.89));border:1px solid rgba(255,202,213,.22);min-height:0;display:flex;flex-direction:column;gap:clamp(6px,1dvh,10px);}
.rb-options-card h2 {margin:0;font-size:clamp(16px,3.2vw,22px);letter-spacing:.35px;font-weight:850;}
.rb-options-card p {margin:0;font-size:clamp(11px,2.4vw,13px);line-height:1.35;color:#f4beca;}
.rb-options-list {display:flex;flex-direction:column;gap:clamp(7px,1.3dvh,10px);}
.rb-option-row {display:flex;flex-direction:column;gap:4px;min-width:0;}
.rb-option-row>span {font-size:clamp(11px,2.4vw,13px);font-weight:800;letter-spacing:.35px;color:#fff;}
.rb-option-group {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;}
.rb-option-group.two {grid-template-columns:repeat(2,minmax(0,1fr));}
.rb-option-choice {min-width:0;min-height:clamp(36px,5.0dvh,46px);padding:7px 3px;border:1px solid #d2a1aa40;border-radius:3px;background:#4b0010a8;color:#f4d8dc;font-weight:780;font-size:clamp(10px,2.35vw,15px);line-height:1.1;}
.rb-option-choice[aria-pressed=true] {background:#f6dde2;color:#79001b;border-color:#fff0f1;}
.rb-option-choice:active {filter:brightness(1.12);}
.rb-options-secondary {flex:0 0 auto;padding:clamp(10px,1.5dvh,14px);background:rgba(43,0,8,.55);border:1px solid rgba(255,202,213,.18);display:flex;flex-direction:column;gap:clamp(5px,.8dvh,8px);min-height:0;}
.rb-option-meta {display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:clamp(2px,.4dvh,5px) 0;border-bottom:1px solid #c5738046;}
.rb-option-meta:last-of-type {border-bottom:0;}
.rb-options-secondary h2 {margin:0;font-size:clamp(16px,3.2vw,21px);font-weight:850;}
.rb-option-meta strong {font-size:clamp(12px,2.4vw,14px);}
.rb-option-meta small {display:block;color:#f1b5c3;margin-top:3px;font-size:clamp(10px,2vw,12px);}
.rb-option-meta .val {white-space:nowrap;font-size:clamp(11px,2.3vw,14px);font-weight:850;color:#fff;}
.rb-option-reset {min-height:42px;align-self:stretch;background:#40000b;border:1px solid #db8e9c66;color:#fff0f2;font-weight:800;font-size:clamp(11px,2.4vw,13px);padding:9px 12px;cursor:pointer;}
.rb-options-feedback {font-size:12px!important;color:#fff4f5!important;min-height:14px;}
.rb-options-tip {color:#f2bfc9;font-size:clamp(10px,2.2vw,12px);line-height:1.42;margin-top:auto;}
@media (min-width:740px) and (orientation:landscape) {
 .rb-options-layout{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(0,.88fr);align-content:start;overflow:hidden;}
 .rb-options-card,.rb-options-secondary{flex:initial;height:max-content;max-height:100%;overflow-y:auto;}
 .rb-options-secondary{align-self:start;}
 .rb-option-choice{font-size:clamp(12px,1.25vw,15px);}
}
@media (max-height:590px) and (orientation:portrait) {
 .rb-options-body{padding:7px 10px;}
 .rb-options-layout{gap:5px;}
 .rb-options-card{padding:8px;gap:6px;}
 .rb-options-card h2{font-size:15px;}
 .rb-options-card p{font-size:10px;}
 .rb-options-list{gap:5px;}
 .rb-option-row{gap:3px;}
 .rb-option-choice{min-height:31px;font-size:10px;padding:4px 2px;}
 .rb-options-secondary{padding:8px;gap:5px;}
 .rb-option-meta{padding:2px 0;}
 .rb-option-reset{min-height:30px;padding:4px;}
 .rb-options-tip{font-size:10px;}
}
@media (max-height:430px) and (orientation:landscape) {
 .rb-options-body{padding:5px 10px;}
 .rb-options-card{padding:9px;gap:4px;}
 .rb-options-card p{font-size:10px;}
 .rb-options-list{gap:4px;}
 .rb-option-choice{min-height:30px;padding:4px 3px;}
 .rb-options-secondary{padding:9px;gap:4px;}
 .rb-option-meta{padding:2px 0;}
 .rb-option-reset{min-height:30px;}
}


  /* V18: Matchgewinn, klare Event-Ueberschrift und hell lesbare Gruppen-Restpunkte. */
  .g-hint .g-match-victory {
    display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px;
    background:#e7f8e9;border:1px solid #94caa1;border-left:4px solid #1c9a52;
    color:#155c32;text-align:center;padding:clamp(8px,1.5dvh,12px) 8px;
    margin:0 0 clamp(11px,1.7dvh,17px);line-height:1.3;
    font-size:clamp(13px,3.0vw,18px);font-weight:650;
  }
  .g-match-victory strong {font-weight:900;overflow-wrap:anywhere;}
  .g-match-victory-icon {font-weight:950;display:grid;place-items:center;border-radius:50%;background:#1c9a52;color:#fff;width:22px;height:22px;flex:none;}
  .tourney-summary-heading{
    display:flex;align-items:stretch;gap:clamp(10px,3vw,22px);flex:0 0 auto;
    background:#630d24;border:1px solid #a94761;color:#fff;
    padding:clamp(8px,1.6dvh,12px) clamp(10px,2.6vw,18px);min-width:0;
  }
  .tourney-summary-brand {display:flex;flex-direction:column;justify-content:center;min-width:0;gap:2px;color:#fff;}
  .tourney-summary-brand strong {font-size:clamp(12px,3vw,17px);font-weight:850;line-height:1.18;color:#fff;}
  .tourney-summary-brand span {font-size:clamp(11px,2.6vw,15px);font-weight:700;color:#fff;line-height:1.2;}
  .tourney-summary-separator {width:1px;align-self:stretch;min-height:35px;background:rgba(255,255,255,.75);flex:none;}
  .tourney-summary-phase {display:flex;align-items:center;justify-content:center;min-width:0;
    margin-left:auto;text-align:center;color:#fff;font-size:clamp(12px,3vw,17px);font-weight:850;overflow-wrap:anywhere;}
  .tourney-rest-summary {margin:0;background:#fff;border:1px solid #decbd0;padding:0;color:#271a20;}
  .tourney-rest-heading {display:flex;align-items:center;justify-content:space-between;gap:7px;
    padding:9px 11px;background:#f1e6e9;border-bottom:1px solid #dbbfc6;color:#57152a;}
  .tourney-rest-heading h3 {margin:0;font-size:clamp(13px,3vw,17px);font-weight:900;letter-spacing:.4px;color:#57152a;}
  .tourney-rest-heading span {font-size:clamp(10px,2.4vw,13px);font-weight:750;color:#75253d;}
  .tourney-rest-table-wrap {overflow-x:auto;max-width:100%;}
  .tourney-rest-table {width:100%;border-collapse:collapse;table-layout:fixed;
    color:#262027;font-size:clamp(12px,2.9vw,16px);font-variant-numeric:tabular-nums;}
  .tourney-rest-table thead {background:#ece0e3;}
  .tourney-rest-table th,.tourney-rest-table td {border-bottom:1px solid #e3d9dd;padding:clamp(8px,1.6dvh,12px) 7px;text-align:center;color:inherit;}
  .tourney-rest-table thead th {color:#5f1c31;font-weight:900;font-size:clamp(11px,2.7vw,14px);overflow-wrap:anywhere;}
  .tourney-rest-table tr th:first-child {width:27%;text-align:left;font-weight:850;}
  .tourney-rest-table tbody tr:nth-child(even){background:#faf6f7;}
  .tourney-rest-value {display:inline-block;min-width:32px;padding:4px 8px;border-radius:4px;font-weight:900;}
  .tourney-rest-value.is-zero {background:#e1f4e7;color:#17763a;}
  .tourney-rest-value.is-open {background:#f7e5e9;color:#76213a;}
  .tourney-rest-table tfoot {background:#73172f;color:white;font-weight:900;}
  .tourney-rest-table tfoot th,.tourney-rest-table tfoot td {color:white;border-bottom:0;padding:11px 7px;}
  .tourney-rest-table tfoot strong {font-size:clamp(15px,3.4vw,20px);}
  .tourney-rest-summary p {margin:0;padding:9px 11px;color:#5b4a51;font-size:clamp(11px,2.5vw,13px);line-height:1.4;}
  .tourney-rest-zero-key {background:#e1f4e7;color:#17763a;font-weight:900;padding:1px 5px;border-radius:3px;}
  @media(max-height:540px){
    .tourney-summary-heading {padding:5px 9px;}
    .tourney-summary-separator {min-height:26px;}
    .g-hint .g-match-victory {padding:6px;margin-bottom:6px;}
  }

  /* V22: Turnierphase, Matchmenue und visuelle Statistik-Korrekturen. */
  .g-key.g-special:disabled{opacity:1!important;background:#dad0d4!important;color:#451525!important;}
  .g-phase-bar{flex:0 0 auto;height:clamp(22px,3.4dvh,29px);display:flex;align-items:center;justify-content:center;
    background:#71122b;color:#fff;font-weight:900;letter-spacing:.75px;font-size:clamp(10px,2.2vw,13px);
    border-bottom:1px solid #4f081b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 10px;}
  .g-menu-overlay{position:absolute;inset:0;z-index:35;background:rgba(19,5,12,.70);display:flex;
    justify-content:center;align-items:center;padding:clamp(10px,3vw,28px);}
  .g-menu-panel{width:min(100%,460px);max-height:min(88dvh,720px);overflow-y:auto;overscroll-behavior:contain;
    background:#fff9fa;color:#281a20;border:1px solid #b75d76;border-radius:13px;
    box-shadow:0 12px 55px #15000a75;padding:clamp(15px,3.4vw,23px);}
  .g-menu-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px;}
  .g-menu-title h2{margin:0;color:#68162e;font-size:clamp(21px,4.5vw,27px);}
  .g-menu-x{background:#eee0e4;border:0;border-radius:6px;color:#64223a;font-size:24px;line-height:1;width:37px;height:37px;flex:none;}
  .g-menu-sub{color:#735360;font-weight:750;font-size:12px;letter-spacing:.35px;margin:0 0 7px;}
  .g-menu-info{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:0 0 15px;}
  .g-menu-info>div{background:#f2e9ec;padding:10px 11px;min-width:0;display:flex;flex-direction:column;gap:4px;}
  .g-menu-info small{font-size:10px;font-weight:850;color:#764256;letter-spacing:.4px;}
  .g-menu-info strong{font-size:clamp(12px,2.7vw,16px);color:#361e29;overflow-wrap:anywhere;}
  .g-menu-split{border-top:1px solid #ddc7cf;margin:14px 0;}
  .g-menu-actions{display:flex;flex-direction:column;gap:8px;}
  .g-menu-btn{width:100%;min-height:43px;border:0;border-radius:5px;background:#80203b;color:#fff;font-weight:900;font-size:clamp(12px,2.8vw,15px);padding:10px;}
  .g-menu-btn.secondary{background:#eadfe3;color:#662139;}
  .g-menu-btn.danger{background:#b32238;color:#fff;}
  .g-menu-warning{background:#fff0f0;border-left:4px solid #bb2b3d;padding:10px 12px;color:#5c2732;font-size:clamp(12px,2.9vw,15px);line-height:1.5;margin:5px 0 17px;}
  .g-menu-confirm-title{font-size:clamp(19px,4.3vw,24px);font-weight:950;color:#87192d;margin:0 0 9px;}
  .summary-grid{margin-bottom:clamp(12px,2dvh,20px);}
  .summary-detail.is-leg>summary{background:#65152c;border-color:#4a0b1c;}
  .summary-detail.is-leg>summary>span:first-child{color:#fff;}
  .summary-detail.is-leg>summary small{color:#f3cbd5;}
  .summary-detail.is-leg>summary .summary-caret{color:#fff;}
  .tourney-rest-table{table-layout:fixed;width:100%;font-size:clamp(10px,2.55vw,15px);}
  .tourney-rest-table tr th:first-child{width:26%;text-align:left;overflow-wrap:anywhere;}
  .tourney-rest-table thead th{font-size:clamp(9px,2.3vw,13px);}
  .tourney-rest-table th,.tourney-rest-table td{padding:clamp(8px,1.6dvh,12px) clamp(2px,1vw,7px);}
  .tourney-rest-value{min-width:0;padding:4px clamp(3px,1vw,8px);max-width:100%;}
  .tourney-rest-sum{color:#65172d;font-weight:950;background:#f5e6ea;}
  @media(max-height:510px){.g-menu-panel{max-height:96dvh;padding:10px 14px;}.g-menu-info{gap:4px;margin-bottom:5px;}.g-menu-info>div{padding:6px 9px;}.g-phase-bar{height:19px;}}

  /* Native Android fullscreen: reserve a stable flex slot for Double/Triple. */
  .match-screen{min-height:0;max-height:100%;}
  .match-screen .g-pad{min-height:0;overflow:hidden;grid-template-rows:minmax(0,1fr) clamp(58px,10.5dvh,86px);}
  .match-screen .g-rings{min-height:0;position:relative;z-index:2;}
  .match-screen .g-ring{min-height:0;padding:2px 5px;}
  .match-screen .g-numbers{min-height:0;}
  .match-screen .g-key{min-height:0;}
  .match-screen .g-rings button{touch-action:manipulation;}
  .match-screen .g-pad{padding-bottom:env(safe-area-inset-bottom,0px);}
  @media(max-width:420px) and (min-height:600px){
    .match-screen .g-top{height:clamp(55px,8dvh,72px);}
    .match-screen .g-board{height:clamp(140px,26dvh,245px);}
    .match-screen .g-darts{height:clamp(68px,10dvh,88px);}
  }
  @media (max-height:580px){
    .match-screen .g-board{height:clamp(85px,26dvh,145px);}

  /* V24: Namen und Spielstände; auch bei vorhandenen Profilen gut lesbar. */
  .g-name, .summary-player-head strong, .summary-winner strong,
  .p4-name, .p5-name, .p4-tile, .p5-row,
  .pm-player .pm-person strong, .pm-profile-heading h2,
  .rb-stats-person-main strong, .rb-stat-detail-title h2,
  .rb-results-winner, .rb-results-score, .g-match-victory strong,
  .g-winner-name, .g-stand td:first-child,
  .tourney-rest-table tbody th, .p4-input, .pm-input,
  #pm-profile-name {text-transform:uppercase;}

  /* V25: schlankere, moderne Typografie und fein abgestimmte Match-Proportionen. */
  body, .screen {font-family:Roboto, "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
  .screen {letter-spacing:-.012em;}
  .screen :is(h1,h2,h3,strong,b){font-weight:700;}
  .screen button{font-weight:700;}
  .match-screen .g-top {height:clamp(62px,8.6dvh,80px);}
  .match-screen .g-round {font-size:clamp(12px,2.8vw,16px);font-weight:750;line-height:1.17;letter-spacing:-.01em;}
  .match-screen .g-wincondition {font-size:clamp(11px,2.45vw,15px);font-weight:700;line-height:1.2;
    max-width:170px;letter-spacing:-.012em;}
  .match-screen .g-head-left {gap:clamp(5px,1.1vw,12px);}
  .match-screen .g-head-divider {min-height:34px;}
  .match-screen .g-center .g-title {font-weight:750;font-size:clamp(25px,5.2vw,38px);letter-spacing:-.025em;}
  .match-screen .g-center .g-sub {font-size:clamp(11.5px,2.75vw,16px);font-weight:550;
    line-height:1.16;letter-spacing:-.02em;margin-top:3px;}
  .match-screen .g-score {font-size:clamp(38px,7.1dvh,68px);font-weight:750;letter-spacing:-.032em;}
  .match-screen .g-name {font-size:clamp(15px,3.35vw,23px);font-weight:700;letter-spacing:.003em;margin-top:4px;}
  .match-screen .g-key {font-weight:700;}
  .match-screen .g-ring {font-weight:700;}
  .match-screen .g-phase-bar {font-weight:700;}
  @media (min-width:700px) and (orientation:landscape) {
    .match-screen .g-top {height:clamp(53px,8.8dvh,77px);}
    .match-screen .g-round {font-size:clamp(12px,2.8dvh,17px);}
    .match-screen .g-wincondition {font-size:clamp(11px,2.65dvh,16px);}
    .match-screen .g-center .g-sub {font-size:clamp(12px,2.5dvh,17px);}
    .match-screen .g-score {font-size:clamp(38px,8.3dvh,72px);}
    .match-screen .g-name {font-size:clamp(14px,2.9dvh,23px);}
  }
  @media (max-width:360px) {
    .match-screen .g-top {padding:0 6px;gap:3px;}
    .match-screen .g-round {font-size:clamp(11px,3.1vw,12.5px);}
    .match-screen .g-wincondition {font-size:clamp(10px,2.75vw,12px);max-width:92px;}
    .match-screen .g-center .g-sub {font-size:clamp(10.5px,3.1vw,12px);}

  @media (max-height:580px) {
    .match-screen .g-top {height:clamp(43px,10dvh,56px);}
    .match-screen .g-round {font-size:clamp(10px,2.5dvh,14px);}
    .match-screen .g-wincondition {font-size:clamp(9.5px,2.45dvh,13px);}
    .match-screen .g-center .g-title {font-size:clamp(22px,5.6dvh,35px);}
    .match-screen .g-center .g-sub {font-size:clamp(10.5px,2.5dvh,14px);}
    .match-screen .g-score {font-size:clamp(28px,7.4dvh,52px);}

  /* Kleine Displays: kompakte, lesbare Siegbedingung; tatsächliche Regeln unverändert. */
  .match-screen .g-cond-compact {display:none;}
  @media (max-width:360px) {
    .match-screen .g-cond-regular {display:none;}
    .match-screen .g-cond-compact {display:inline;}
  }
  @media (min-width:361px) and (max-width:600px) {
    .match-screen .g-round {font-size:13px;}
    .match-screen .g-wincondition {font-size:12.5px;}
  }

  /* 21 / 15A – GLUT-HORIZONT: Breites, zurückhaltendes Lichtband am unteren Rand. */
  .home-screen[data-home-bg="21"]{
    background:
      radial-gradient(ellipse 138% 25% at 50% 112%,rgba(255,84,50,.76),transparent 72%),
      radial-gradient(ellipse 120% 45% at 51% 111%,rgba(147,23,29,.53),transparent 73%),
      linear-gradient(180deg,#080c12 0%,#0d1017 63%,#3b1118 100%);
  }
  .home-screen[data-home-bg="21"]::before{inset:0;width:100%;height:100%;background:linear-gradient(0deg,rgba(239,98,73,.14),transparent 35%);}
  .home-screen[data-home-bg="21"]::after{inset:0;width:100%;height:100%;background:radial-gradient(ellipse 80% 15% at 50% 103%,rgba(255,177,124,.17),transparent 78%);}

  /* 22 / 15B – DOPPELGLUT: Zwei getrennte leuchtende Ecken. */
  .home-screen[data-home-bg="22"]{
    background:
      radial-gradient(ellipse 68% 40% at -15% -7%,rgba(245,83,45,.66),transparent 72%),
      radial-gradient(ellipse 75% 35% at 118% 108%,rgba(222,35,59,.73),transparent 73%),
      radial-gradient(ellipse 110% 85% at 48% 55%,rgba(73,18,33,.20),transparent 75%),
      linear-gradient(155deg,#1b0e16 0%,#0e1017 54%,#250b18 100%);
  }
  .home-screen[data-home-bg="22"]::before{inset:0;width:100%;height:100%;background:radial-gradient(ellipse 40% 25% at 1% 2%,rgba(255,188,117,.14),transparent);}
  .home-screen[data-home-bg="22"]::after{inset:0;width:100%;height:100%;background:linear-gradient(130deg,rgba(255,255,255,.025),transparent 36% 78%,rgba(255,61,94,.075));}

  /* 23 / 15C – VULKAN-HERZ: Gesättigte rot-orange Glut, kompakt und zentral unten. */
  .home-screen[data-home-bg="23"]{
    background:
      radial-gradient(ellipse 48% 32% at 47% 111%,rgba(255,156,61,.84),transparent 63%),
      radial-gradient(ellipse 75% 48% at 47% 111%,rgba(222,54,33,.77),transparent 67%),
      radial-gradient(ellipse 110% 61% at 50% 110%,rgba(136,18,31,.48),transparent 74%),
      linear-gradient(160deg,#101014 0%,#161017 63%,#431015 100%);
  }
  .home-screen[data-home-bg="23"]::before{inset:0;width:100%;height:100%;background:radial-gradient(ellipse 33% 19% at 48% 106%,rgba(255,234,154,.24),transparent 85%);}
  .home-screen[data-home-bg="23"]::after{inset:0;width:100%;height:100%;background:repeating-linear-gradient(140deg,rgba(255,179,123,.014) 0 1px,transparent 1px 22px);}

  /* 24 / 15D – BORDEAUX-EMBER: Kirschroter Schimmer mit sehr dezenten weißen Resonanzringen. */
  .home-screen[data-home-bg="24"]{
    background:
      radial-gradient(ellipse 110% 77% at 121% 61%,rgba(192,22,72,.58),transparent 69%),
      radial-gradient(ellipse 77% 75% at 105% 99%,rgba(240,66,105,.22),transparent 77%),
      radial-gradient(ellipse 88% 59% at -12% -7%,rgba(106,27,51,.14),transparent 75%),
      linear-gradient(145deg,#120e17 0%,#200b1a 56%,#300916 100%);
  }
  .home-screen[data-home-bg="24"]::before{
    inset:0;width:100%;height:100%;
    background:
      radial-gradient(circle at 77% 58%,
        transparent 0 18%,
        rgba(255,255,255,0) 18.2%,
        rgba(255,255,255,.22) 18.75%,
        rgba(255,242,246,.06) 19.45%,
        transparent 20.15%),
      radial-gradient(circle at 77% 58%,
        transparent 0 29.8%,
        rgba(255,255,255,0) 30%,
        rgba(255,250,252,.15) 30.55%,
        rgba(255,233,240,.05) 31.2%,
        transparent 31.95%),
      radial-gradient(circle at 71% 52%,
        transparent 0 10.5%,
        rgba(255,255,255,0) 10.7%,
        rgba(255,255,255,.13) 11.15%,
        rgba(255,238,244,.04) 11.75%,
        transparent 12.45%),
      linear-gradient(113deg,rgba(0,0,0,.24),transparent 48% 74%,rgba(109,1,31,.10));
  }
  .home-screen[data-home-bg="24"]::after{
    inset:0;width:100%;height:100%;
    background:
      radial-gradient(ellipse 56% 47% at 112% 67%,rgba(255,141,164,.09),transparent 72%),
      radial-gradient(ellipse 24% 18% at 76% 58%,rgba(255,255,255,.035),transparent 84%);
  }

  /* 25 / 15E – KUPFERFUNKE: Schwarzer Raum, kleiner kupferner Kern links oben. */
  .home-screen[data-home-bg="25"]{
    background:
      radial-gradient(ellipse 50% 33% at 4% 2%,rgba(250,126,51,.73),transparent 68%),
      radial-gradient(ellipse 82% 51% at -8% -9%,rgba(172,43,32,.42),transparent 75%),
      radial-gradient(ellipse 74% 38% at 98% 97%,rgba(122,19,36,.12),transparent 75%),
      linear-gradient(153deg,#251518 0%,#0d1016 52%,#070a12 100%);
  }
  .home-screen[data-home-bg="25"]::before{inset:0;width:100%;height:100%;background:radial-gradient(ellipse 32% 17% at 0% 0%,rgba(255,223,166,.18),transparent 85%);}
  .home-screen[data-home-bg="25"]::after{inset:0;width:100%;height:100%;background:linear-gradient(163deg,rgba(255,255,255,.025),transparent 33% 83%,rgba(0,0,0,.17));}

    /* 15C1: Vulkan-Herz DEZENT – dichter, niedriger, dunkler, weniger Licht. */
  .home-screen[data-home-bg="26"]{
    background:
      radial-gradient(ellipse 37% 25% at 48% 111%,rgba(245,124,61,.35),transparent 67%),
      radial-gradient(ellipse 60% 38% at 48% 110%,rgba(180,43,39,.46),transparent 72%),
      radial-gradient(ellipse 94% 53% at 49% 113%,rgba(108,18,37,.36),transparent 77%),
      linear-gradient(160deg,#0f1015 0%,#171117 63%,#341018 100%);
  }
  .home-screen[data-home-bg="26"]::before{inset:0;width:100%;height:100%;background:radial-gradient(ellipse 28% 14% at 48% 108%,rgba(255,202,138,.11),transparent 87%);}
  .home-screen[data-home-bg="26"]::after{inset:0;width:100%;height:100%;background:repeating-linear-gradient(140deg,rgba(255,179,123,.010) 0 1px,transparent 1px 24px);}
  /* 15C – Vulkan-Herz, ohne Glutkern: Grundton und feine Linien bleiben erhalten. */
  .home-screen[data-home-bg="27"]{
    background:linear-gradient(160deg,#101014 0%,#161017 63%,#431015 100%);
  }
  .home-screen[data-home-bg="27"]::before{
    inset:0;width:100%;height:100%;background:none;
  }
  .home-screen[data-home-bg="27"]::after{
    inset:0;width:100%;height:100%;
    background:repeating-linear-gradient(140deg,rgba(255,179,123,.014) 0 1px,transparent 1px 22px);
  }
  /* 15C3: Vulkan-Herz INTENSIV – hellere Glut, sattes Burgunderrot. */
  .home-screen[data-home-bg="28"]{
    background:
      radial-gradient(ellipse 48% 34% at 47% 112%,rgba(255,178,78,.97),transparent 64%),
      radial-gradient(ellipse 78% 51% at 47% 112%,rgba(235,61,33,.88),transparent 70%),
      radial-gradient(ellipse 114% 67% at 47% 110%,rgba(167,17,39,.65),transparent 76%),
      radial-gradient(ellipse 70% 45% at 103% 70%,rgba(94,4,27,.24),transparent 80%),
      linear-gradient(160deg,#111015 0%,#1c0d18 55%,#541018 100%);
  }
  .home-screen[data-home-bg="28"]::before{inset:0;width:100%;height:100%;background:radial-gradient(ellipse 32% 20% at 48% 107%,rgba(255,237,170,.38),transparent 85%);}
  .home-screen[data-home-bg="28"]::after{inset:0;width:100%;height:100%;background:repeating-linear-gradient(140deg,rgba(255,179,123,.014) 0 1px,transparent 1px 22px);}

  /* Kein Design-Umschalter in dieser Einzelfassung. */


  /* Startseiten-Hintergrund 15C ohne Glutkern auf die übrigen Seiten übertragen.
     Ausnahme: Rebstock Darts League einschließlich Turnierphasen.
     Scoreboard und Tastenfelder der Spielansicht bleiben unverändert. */
  .screen:not(.home-screen):not(.rebstock-event-screen){
    background:linear-gradient(160deg,#101014 0%,#161017 63%,#431015 100%);
  }
  .screen:not(.home-screen):not(.rebstock-event-screen):not(.match-screen)::before{
    inset:0;width:100%;height:100%;border-radius:0;transform:none;background:none;
  }
  .screen:not(.home-screen):not(.rebstock-event-screen):not(.match-screen)::after{
    inset:0;width:100%;height:100%;border-radius:0;transform:none;
    background:repeating-linear-gradient(140deg,rgba(255,179,123,.014) 0 1px,transparent 1px 22px);
  }


  /* Final-Turnier: Interpretation des roten Linien-Referenzbilds in reinem CSS.
     Keine Bilddatei, kein SVG oder Canvas als Hintergrund. */
  .rebstock-event-screen{
    background:
      radial-gradient(ellipse 50% 68% at -7% 42%,rgba(115,3,21,.30),transparent 82%),
      radial-gradient(ellipse 36% 54% at 102% 95%,rgba(57,0,9,.18),transparent 86%),
      linear-gradient(106deg,#12070b 0%,#0a070a 40%,#08080b 100%);
  }
  .rebstock-event-screen::before{
    inset:0;width:100%;height:100%;border-radius:0;transform:none;
    background:repeating-linear-gradient(90deg,rgba(210,16,40,.018) 0 1px,transparent 1px 23px);
  }
  .rebstock-event-screen::after{
    inset:0;width:100%;height:100%;border-radius:0;transform:none;
    background:linear-gradient(90deg,transparent 0%,rgba(6,4,8,.24) 27%,rgba(7,6,9,.02) 70%);
  }
  .rebstock-event-screen>.rb-light-traces{
    position:absolute;inset:0 auto 0 0;width:min(39%,430px);height:100%;
    z-index:0;pointer-events:none;overflow:hidden;
    opacity:.95;
    mask-image:linear-gradient(90deg,#000 0 68%,rgba(0,0,0,.62) 86%,transparent 100%);
    -webkit-mask-image:linear-gradient(90deg,#000 0 68%,rgba(0,0,0,.62) 86%,transparent 100%);
  }
  .rb-light-traces::before{
    content:"";position:absolute;inset:0;
    background:repeating-linear-gradient(90deg,transparent 0 9px,rgba(186,14,33,.085) 10px 11px,transparent 12px 21px);
  }
  .rb-light-traces .rb-pipe{
    position:absolute;left:var(--x);top:var(--y);bottom:-14px;height:auto;width:var(--w);
    border-left:var(--stroke,2px) solid rgba(231,15,33,var(--alpha,.70));
    border-right:1px solid rgba(172,9,25,.26);
    border-top:1px solid rgba(226,11,31,var(--alpha,.70));
    box-shadow:-2px 0 7px rgba(225,6,27,.11),inset 2px 0 7px rgba(158,9,28,.10);
    filter:drop-shadow(0 0 2px rgba(235,6,31,.16));
  }
  .rb-light-traces .rb-pipe:nth-child(2n){border-right:0;}
  .rb-light-traces .rb-pipe:nth-child(3n){border-top-width:2px;}
  .rb-light-traces .rb-pipe:nth-child(4n){--alpha:.45;--stroke:1px;}
  .rb-light-traces .rb-pipe:nth-child(5n){border-right:2px solid rgba(180,9,25,.35);}
  .rebstock-event-screen>.page-top,
  .rebstock-event-screen>.tourney-scroll,
  .rebstock-event-screen>.tourney-footer{position:relative;z-index:1;}
  .rebstock-event-screen .page-top{background:linear-gradient(100deg,rgba(43,0,10,.86),rgba(15,8,12,.90));border-bottom-color:rgba(226,24,50,.25);}
  .rebstock-event-screen .tourney-head h2{text-shadow:0 2px 7px rgba(0,0,0,.5);}
  .rebstock-event-screen .tourney-head .event-kicker{color:#ffc2cb;}
  .rebstock-event-screen .tourney-phase{
    background:linear-gradient(100deg,rgba(107,8,26,.86),rgba(26,7,14,.92));
    border:1px solid rgba(231,90,111,.25);
    border-left:4px solid #e51c38;
    box-shadow:0 8px 20px rgba(0,0,0,.24),inset 0 1px 0 rgba(255,255,255,.05);
  }
  .rebstock-event-screen .tourney-phase:active{background:linear-gradient(100deg,rgba(158,12,39,.92),rgba(44,7,17,.95));}
  .rebstock-event-screen .tourney-settings{background:rgba(26,5,12,.89);border-color:rgba(231,90,111,.25);}
  .rebstock-event-screen .tourney-consequence,
  .rebstock-event-screen .tourney-rest-info{background:rgba(38,5,14,.87);border-left-color:#e51c38;}
  .rebstock-event-screen .tourney-footer{background:rgba(17,5,10,.93);}
  @media(min-width:700px){
    .rebstock-event-screen>.rb-light-traces{width:min(30%,460px)}
  }

  /* Dynamischer schwarzer Lesebereich nur hinter den Seitentiteln.
     Der Hintergrund passt sich der tatsächlichen Text-Höhe an; nichts ragt in
     die nächsten Menüpunkte oder seitlich aus dem Bildschirm. */
  .rebstock-event-screen .tourney-scroll{overflow-x:hidden;touch-action:pan-y;}
  .rebstock-event-screen .tourney-wrap{min-width:0;max-width:100%;}
  .rebstock-event-screen .tourney-head{
    position:relative;isolation:isolate;
    box-sizing:border-box;width:fit-content;max-width:100%;min-width:0;
    padding:clamp(19px,3.5dvh,29px) clamp(20px,4.7vw,36px);
    margin:0 0 clamp(16px,3dvh,25px);
    overflow:hidden;
  }
  .rebstock-event-screen .tourney-head > *{position:relative;z-index:1;overflow-wrap:break-word;text-shadow:0 1px 5px rgba(0,0,0,.42);}
  .rebstock-event-screen .tourney-head::before{
    content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
    /* Kein sichtbares Rechteck: Der schwarze Kern blendet zu ALLEN Kanten
       stufenlos aus, statt nur rechts eine Verlaufsfläche abzuschneiden. */
    background:rgba(5,5,8,.98);
    -webkit-mask-image:radial-gradient(ellipse 55% 54% at 50% 50%,
      #000 0 42%,rgba(0,0,0,.98) 52%,rgba(0,0,0,.79) 69%,
      rgba(0,0,0,.39) 85%,transparent 100%);
    mask-image:radial-gradient(ellipse 55% 54% at 50% 50%,
      #000 0 42%,rgba(0,0,0,.98) 52%,rgba(0,0,0,.79) 69%,
      rgba(0,0,0,.39) 85%,transparent 100%);
  }
  .rebstock-event-screen .tourney-grid,
  .rebstock-event-screen .tourney-settings,
  .rebstock-event-screen .tourney-consequence{position:relative;z-index:1;}


  /* Event-Schritte übernehmen nur im Turnierablauf denselben CSS-Lichtlinienhintergrund. */
  .event-flow-screen>.page-top,
  .event-flow-screen>.p4-main,
  .event-flow-screen>.p5-main,
  .event-flow-screen>.p4-footer {position:relative;z-index:1;}
  .event-flow-screen .p4-footer {
    background:rgba(19,5,10,.92);
    border-top-color:rgba(226,24,50,.28);
  }
  .event-flow-screen .p4-panel {
    background:rgba(23,5,11,.83);
    border-color:rgba(241,128,147,.24);
  }
  /* Spieler wählen / Reihenfolge: schwarze Fläche ist in Höhe und Breite
     vom Inhalt abhängig, mit Abstand zu den darunterliegenden Elementen. */
  .event-flow-screen .p4-head {
    position:relative;isolation:isolate;
    box-sizing:border-box;width:100%;max-width:100%;min-width:0;
    margin:0 0 clamp(14px,2.7dvh,23px);
    padding:clamp(17px,2.8dvh,23px) clamp(20px,4.7vw,29px);
    overflow:hidden;
    flex-wrap:wrap;column-gap:10px;row-gap:6px;
  }
  .event-flow-screen .p4-head > * {position:relative;z-index:1;min-width:0;text-shadow:0 1px 4px rgba(0,0,0,.34);}
  .event-flow-screen .p4-head > :first-child{flex:1 1 150px;}
  .event-flow-screen .p4-head .p4-count{flex:0 0 auto;max-width:100%;}
  .event-flow-screen .p4-head::before {
    content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
    background:rgba(5,5,8,.96);
    -webkit-mask-image:radial-gradient(ellipse 59% 56% at 50% 50%,
      #000 0 40%,rgba(0,0,0,.96) 52%,rgba(0,0,0,.77) 69%,
      rgba(0,0,0,.35) 85%,transparent 100%);
    mask-image:radial-gradient(ellipse 59% 56% at 50% 50%,
      #000 0 40%,rgba(0,0,0,.96) 52%,rgba(0,0,0,.77) 69%,
      rgba(0,0,0,.35) 85%,transparent 100%);
  }
  .event-flow-screen .p4-tiles,
  .event-flow-screen .p5-list{overflow-x:hidden;touch-action:pan-y;}
  .event-flow-screen .p4-layout,
  .event-flow-screen .p5-panel{min-width:0;max-width:100%;}
  .event-flow-screen{touch-action:pan-y;overscroll-behavior-x:none;}
  @media(max-height:650px){
    .event-flow-screen .p4-head{padding:10px 15px;margin-bottom:11px;}
  }
  /* Turnier: Bei voller Auswahl bleiben nur die zwei aktiven Spieler anklickbar. */
  .event-flow-screen .p4-tile:disabled {
    opacity:1;
    color:rgba(255,236,241,.53);
    background:linear-gradient(130deg,rgba(22,7,13,.96),rgba(23,6,11,.95));
    border-color:rgba(255,195,206,.13);
    box-shadow:none;
    cursor:not-allowed;
  }
  .event-flow-screen .p4-tile:disabled .p4-avatar {background:rgba(255,255,255,.07);color:rgba(255,236,241,.48);}
  .event-flow-screen .p4-tile:disabled .p4-check {border-color:rgba(255,236,241,.20);}
  .p4-limit-note {
    flex:none;position:relative;z-index:1;
    margin:0 2px 8px;padding:7px 10px;
    font-size:clamp(10px,2.35vw,13px);line-height:1.3;
    color:#ffe1e7;background:rgba(15,4,8,.75);
    border-left:3px solid rgba(255,83,113,.88);
  }
  @media(max-height:650px) {
    .p4-limit-note {font-size:10px;padding:4px 7px;margin-bottom:4px;}
  }

  /* Auswahl / Reihenfolge: nur die Aktionsbuttons stehen vor dem Seitenhintergrund. */
  .p4-footer, .event-flow-screen .p4-footer{
    background:transparent;
    border-top:0;
    box-shadow:none;
    backdrop-filter:none;
    -webkit-backdrop-filter:none;
  }
  .p4-footer-content{display:flex;justify-content:flex-end;align-items:center;}
  .p4-footer-content .p4-start{flex:0 1 100%;}
  @media(min-width:700px) and (orientation:landscape){
    .p4-footer-content .p4-start{flex:0 0 min(410px,50%);}
  }


  /* Weitere Verfeinerung: feste, tiefschwarze Textzone, weicher Abfall beginnt
     erst außerhalb des gesamten Textes; Feldgröße folgt der Textmenge. */
  .rebstock-event-screen .tourney-head{
    padding:clamp(26px,4.1dvh,37px) clamp(27px,7vw,52px);
    margin-bottom:clamp(25px,4.2dvh,38px);
    overflow:visible;
  }
  .rebstock-event-screen .tourney-head::before{
    inset:clamp(-16px,-2.5vw,-24px);
    background:
      radial-gradient(ellipse 56% 78% at -8% 44%,rgba(115,3,21,.18),transparent 78%),
      radial-gradient(ellipse 42% 58% at 104% 96%,rgba(57,0,9,.10),transparent 80%),
      linear-gradient(106deg,#12070b 0%,#0a070a 40%,#08080b 100%);
    border-radius:32px;
    -webkit-mask-image:none;
    mask-image:none;
    filter:blur(clamp(22px,5.2vw,34px));
    opacity:.98;
  }
  .rebstock-event-screen .tourney-head::after{
    content:"";position:absolute;z-index:0;pointer-events:none;
    inset:clamp(10px,2vw,16px);
    border-radius:14px;
    background:
      radial-gradient(ellipse 56% 78% at -8% 44%,rgba(115,3,21,.16),transparent 76%),
      radial-gradient(ellipse 42% 58% at 104% 96%,rgba(57,0,9,.09),transparent 78%),
      linear-gradient(106deg,#12070b 0%,#0a070a 40%,#08080b 100%);
  }
  .event-flow-screen .p4-head{
    padding:clamp(21px,3.4dvh,30px) clamp(27px,6.5vw,44px);
    margin-bottom:clamp(21px,3.7dvh,32px);
    overflow:visible;
  }
  .event-flow-screen .p4-head::before{
    inset:clamp(-12px,-2vw,-18px);
    background:
      radial-gradient(ellipse 56% 78% at -8% 44%,rgba(115,3,21,.16),transparent 78%),
      radial-gradient(ellipse 42% 58% at 104% 96%,rgba(57,0,9,.09),transparent 80%),
      linear-gradient(106deg,#12070b 0%,#0a070a 40%,#08080b 100%);
    border-radius:28px;
    -webkit-mask-image:none;
    mask-image:none;
    filter:blur(clamp(18px,4.2vw,28px));
    opacity:.98;
  }
  .event-flow-screen .p4-head::after{
    content:"";position:absolute;z-index:0;pointer-events:none;
    inset:clamp(8px,1.7vw,14px);
    border-radius:12px;
    background:
      radial-gradient(ellipse 56% 78% at -8% 44%,rgba(115,3,21,.14),transparent 76%),
      radial-gradient(ellipse 42% 58% at 104% 96%,rgba(57,0,9,.08),transparent 78%),
      linear-gradient(106deg,#12070b 0%,#0a070a 40%,#08080b 100%);
  }
  /* Jede einzelne Turnierphase: keine schwarze Leiste hinter der Starttaste. */
  .rebstock-event-screen > .tourney-footer{
    background:transparent;
    border:0;
    box-shadow:none;
    backdrop-filter:none;
    -webkit-backdrop-filter:none;
  }
  @media(max-height:650px){
    .rebstock-event-screen .tourney-head{
      padding:20px 25px;
      margin-bottom:22px;
    }
    .event-flow-screen .p4-head{
      padding:15px 22px;
      margin-bottom:16px;
    }
  }


  /* V26 HTML-ENTWURF: Variante 05 Editorial-Siegerseite mit echtem Gesamt/Legs-Wechsel. */
  .editorial-summary{background:linear-gradient(155deg,#111015 0%,#1b1017 62%,#360d1a 100%);min-width:0;}
  .editorial-summary .summary-head{background:linear-gradient(100deg,#771630,#4d0d22);border-bottom:1px solid rgba(255,209,222,.19);}
  .editorial-summary .summary-body{width:min(100%,980px);display:flex;flex-direction:column;gap:10px;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:clamp(10px,2.1vw,22px) clamp(10px,2.4vw,22px) 16px;}
  .editorial-summary .ed-hero{background:#f7f4f4;color:#321b25;border:1px solid #e9d9dd;border-bottom:4px solid #942642;padding:clamp(16px,3.3vw,28px);flex:none;min-width:0;}
  .editorial-summary .ed-kicker{color:#902d4a;font-size:clamp(10px,1.8vw,12px);font-weight:850;letter-spacing:1.3px;text-transform:uppercase;}
