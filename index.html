  .editorial-summary .ed-hero-caption{font-weight:750;letter-spacing:1px;font-size:clamp(10px,2.2vw,13px);color:#89717b;}
  .editorial-summary .ed-winner{margin:6px 0 0;color:#311923;font-size:clamp(31px,7.6vw,67px);line-height:.98;letter-spacing:-1.8px;font-weight:950;overflow-wrap:anywhere;hyphens:auto;}
  .editorial-summary .ed-win-accent{color:#ae3153;}
  .editorial-summary .ed-result{text-align:right;white-space:nowrap;display:flex;flex-direction:column;gap:4px;align-items:flex-end;}
  .editorial-summary .ed-result strong{font-size:clamp(29px,5.7vw,51px);line-height:1;font-variant-numeric:tabular-nums;color:#922441;letter-spacing:-2px;}
  .editorial-summary .ed-result span{font-weight:800;color:#906b79;font-size:clamp(9px,1.75vw,11px);letter-spacing:.9px;}
  .editorial-summary .ed-hero-sub{border-top:1px solid #e2d5d9;margin-top:18px;padding-top:10px;color:#765865;display:flex;gap:6px 14px;justify-content:space-between;flex-wrap:wrap;font-size:clamp(10px,2vw,12px);font-weight:750;}
  .editorial-summary .ed-tabs{background:#f5f0f1;border:1px solid #e4d4d9;display:grid;grid-template-columns:repeat(var(--ed-tab-count,2),minmax(0,1fr));gap:4px;padding:5px;flex:none;}
  .editorial-summary .ed-tabs button{border:0;min-width:0;min-height:44px;padding:10px 5px;border-radius:3px;background:transparent;color:#742b41;font-weight:900;letter-spacing:.6px;font-size:clamp(12px,2.8vw,15px);}
  .editorial-summary .ed-tabs button.active{background:#86233f;color:white;box-shadow:0 3px 8px rgba(80,8,29,.18);}
  .editorial-summary .ed-content{display:flex;flex-direction:column;gap:10px;min-width:0;flex:none;}
  .editorial-summary .ed-section-heading{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:4px 1px 0;color:#fff2f5;flex-wrap:wrap;}
  .editorial-summary .ed-section-heading h2{margin:0;font-size:clamp(16px,3.4vw,22px);letter-spacing:.15px;}
  .editorial-summary .ed-section-heading small{color:#e4acbd;font-weight:800;font-size:clamp(10px,2.2vw,12px);}
  .editorial-summary .ed-players{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border:1px solid #e2cfd5;background:#fff;overflow:hidden;min-width:0;}
  .editorial-summary .ed-players.many{grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:1px;background:#ded3d8;}
  .editorial-summary .ed-player{padding:clamp(12px,2.9vw,22px);min-width:0;display:flex;flex-direction:column;background:#fbf8f9;color:#2c1821;}
  .editorial-summary .ed-player:nth-child(odd){background:#e9dce1;}
  .editorial-summary .ed-player.is-winner{background:#e3cdd6;}
  .editorial-summary .ed-player-name{color:#7a203b;font-size:clamp(11px,2.6vw,14px);font-weight:900;line-height:1.25;overflow-wrap:anywhere;}
  .editorial-summary .ed-player-main{display:flex;flex-direction:column;gap:0;margin:10px 0 13px;}
  .editorial-summary .ed-player-main strong{font-size:clamp(36px,7.5vw,60px);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-2px;}
  .editorial-summary .ed-player-main span{font-size:clamp(9px,1.9vw,11px);font-weight:900;letter-spacing:.8px;color:#886d79;margin-top:4px;}
  .editorial-summary .ed-primary{display:flex;flex-direction:column;border-top:1px solid #d3bbc5;padding-top:11px;gap:2px;}
  .editorial-summary .ed-primary strong{font-size:clamp(23px,5vw,33px);font-weight:920;line-height:1.1;font-variant-numeric:tabular-nums;}
  .editorial-summary .ed-primary span{font-size:clamp(9px,1.9vw,11px);font-weight:850;letter-spacing:.55px;color:#8b6c79;}
  .editorial-summary .ed-mini-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px 6px;margin-top:14px;}
  .editorial-summary .ed-mini-grid div{min-width:0;display:flex;flex-direction:column;gap:4px;}
  .editorial-summary .ed-mini-grid small{color:#795a67;font-weight:750;font-size:clamp(9px,1.9vw,11px);line-height:1.2;}
  .editorial-summary .ed-mini-grid b{font-size:clamp(14px,3vw,19px);line-height:1.1;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;}
  .editorial-summary .ed-leg-pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,110px),1fr));gap:6px;}
  .editorial-summary .ed-leg-pick button{min-width:0;border:1px solid #d6bdc5;background:#f5edf0;color:#512238;padding:9px 7px;display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;min-height:62px;}
  .editorial-summary .ed-leg-pick button.active{background:#7d1d38;color:white;border-color:#ec839e;box-shadow:inset 0 0 0 1px #e2a2b2;}
  .editorial-summary .ed-leg-pick button strong{font-size:clamp(12px,2.5vw,15px);line-height:1.2;}
  .editorial-summary .ed-leg-pick button small{font-size:clamp(10px,2vw,12px);font-weight:700;opacity:.8;overflow-wrap:anywhere;}
  .editorial-summary .ed-leg-title{background:#f5edef;border-left:4px solid #9b2847;color:#381824;padding:clamp(12px,2.7vw,17px);display:flex;justify-content:space-between;align-items:center;gap:8px 16px;flex-wrap:wrap;}
  .editorial-summary .ed-leg-title b{font-size:clamp(16px,3.2vw,22px);}
  .editorial-summary .ed-leg-title span{font-size:clamp(12px,2.3vw,15px);font-weight:800;color:#852440;}
  .editorial-summary .ed-rest{background:#fff9fa;border:1px solid #d8c0c8;color:#492d38;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:4px 10px;}
  .editorial-summary .ed-rest b{font-size:13px;color:#6f1a35;}
  .editorial-summary .ed-rest span{font-size:12px;}
  .editorial-summary .ed-muted{font-size:clamp(10px,2vw,12px);font-weight:650;color:#f1c9d2;line-height:1.45;margin:0;}
  .editorial-summary .summary-footer{background:rgba(25,10,17,.97);border-top:1px solid #673746;}
  .editorial-summary .summary-footer button.secondary{background:#342730;color:#fff0f3;}
  @media(max-width:360px){
    .editorial-summary .ed-hero{padding:13px;}
    .editorial-summary .ed-hero-inner{gap:6px;}
    .editorial-summary .ed-result strong{font-size:27px;letter-spacing:-1px;}
    .editorial-summary .ed-players{grid-template-columns:repeat(2,minmax(0,1fr));}
    .editorial-summary .ed-player{padding:10px 9px;}
    .editorial-summary .ed-mini-grid{gap:9px 3px;}
    .editorial-summary .ed-hero-sub{margin-top:12px;}
  }
  @media(min-width:780px) and (orientation:landscape){
    .editorial-summary .summary-body{display:grid;grid-template-columns:minmax(250px,.86fr) minmax(0,1.14fr);align-items:start;align-content:start;gap:12px;}
    .editorial-summary .ed-hero{grid-column:1;grid-row:1 / span 3;position:sticky;top:0;}
    .editorial-summary .tourney-summary-heading,.editorial-summary .ed-tabs,.editorial-summary .ed-content,.editorial-summary .ed-muted{grid-column:2;min-width:0;}
    .editorial-summary .ed-content{grid-row:auto;}
    .editorial-summary .ed-hero-inner{grid-template-columns:1fr;}
    .editorial-summary .ed-result{align-items:flex-start;text-align:left;}
    .editorial-summary .ed-winner{font-size:clamp(28px,4.6vw,50px);}
  }
  @media(max-height:440px) and (orientation:landscape){
    .editorial-summary .summary-body{display:block;}
    .editorial-summary .ed-hero{position:static;margin-bottom:8px;}
    .editorial-summary .ed-tabs,.editorial-summary .ed-content,.editorial-summary .tourney-summary-heading{margin-bottom:8px;}
  }


/* DESIGN 02 – DUELL-KARTEN. Ausschließlich Matchstatistik; keine anderen Seiten ändern. */
.duel-summary{background:linear-gradient(160deg,#111015 0%,#1d111a 62%,#340d1b 100%);min-width:0;}
.duel-summary .summary-head{background:linear-gradient(100deg,#71162e,#400c21);border-bottom:1px solid rgba(255,209,222,.18);}
.duel-summary .summary-body{width:min(100%,1050px);display:flex;flex-direction:column;gap:12px;min-height:0;overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;padding:clamp(12px,2.8vw,24px) clamp(10px,2.8vw,24px) 18px;}
.duel-summary .duel-banner{display:flex;align-items:center;justify-content:space-between;gap:13px 20px;background:linear-gradient(110deg,#ede2e6,#f7f1f3);border-top:3px solid #a12545;border-bottom:1px solid #d8bfc9;color:#311c25;padding:clamp(14px,3vw,23px);min-width:0;}
.duel-summary .duel-banner-left{min-width:0;display:flex;flex-direction:column;gap:4px;}
.duel-summary .duel-overline{color:#8d3150;font-size:clamp(10px,2vw,12px);font-weight:900;letter-spacing:1.3px;}
.duel-summary .duel-banner-name{font-size:clamp(23px,5.3vw,41px);font-weight:950;line-height:1.06;overflow-wrap:anywhere;letter-spacing:-.8px;}
.duel-summary .duel-banner-caption{color:#76525f;font-size:clamp(10px,2vw,12px);font-weight:850;letter-spacing:.55px;}
.duel-summary .duel-banner-score{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex:none;}
.duel-summary .duel-banner-score strong{font-size:clamp(28px,6.5vw,48px);line-height:1;color:#85233f;letter-spacing:-1px;font-variant-numeric:tabular-nums;white-space:nowrap;}
.duel-summary .duel-banner-score span{font-size:10px;color:#805668;font-weight:850;letter-spacing:.9px;}
.duel-summary .duel-tabs{display:grid;grid-template-columns:repeat(var(--duel-tab-count,2),minmax(0,1fr));gap:4px;padding:5px;background:#ece2e6;border:1px solid #e1cad3;flex:none;}
.duel-summary .duel-tabs button{min-height:43px;border:0;background:transparent;color:#713046;font-size:clamp(12px,2.8vw,15px);font-weight:900;letter-spacing:.45px;padding:10px 5px;}
.duel-summary .duel-tabs button.active{background:#78203d;color:#fff;box-shadow:0 2px 8px rgba(76,8,29,.17);}
.duel-summary .duel-content{display:flex;flex-direction:column;gap:10px;min-width:0;flex:none;}
.duel-summary .duel-context{display:flex;justify-content:space-between;align-items:baseline;gap:8px 15px;flex-wrap:wrap;padding:4px 2px 0;}
.duel-summary .duel-context h2{font-size:clamp(16px,3.6vw,22px);margin:0;line-height:1.15;color:#fff4f6;}
.duel-summary .duel-context small{font-size:clamp(10px,2.2vw,12px);font-weight:800;color:#e3b1bf;}
.duel-summary .duel-selector{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,112px),1fr));gap:6px;min-width:0;}
.duel-summary .duel-selector button{display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-width:0;min-height:59px;border:1px solid #caafba;background:#eae0e4;color:#4d2232;text-align:left;padding:9px 9px;}
.duel-summary .duel-selector button.active{background:#79203b;color:#fff;border-color:#e69bad;box-shadow:inset 0 0 0 1px rgba(255,255,255,.20);}
.duel-summary .duel-selector strong{font-size:clamp(11px,2.5vw,14px);overflow-wrap:anywhere;}
.duel-summary .duel-selector small{font-size:clamp(9px,2vw,11px);font-weight:750;opacity:.85;overflow-wrap:anywhere;}
.duel-summary .duel-leg-highlight{padding:10px 14px;border-left:4px solid #be5471;background:#ede1e6;color:#55223a;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:clamp(11px,2.3vw,13px);font-weight:850;}
.duel-summary .duel-leg-highlight strong{font-size:clamp(13px,2.7vw,17px);color:#70243d;}
.duel-summary .duel-deck{display:grid;grid-template-columns:minmax(0,1fr) 1px minmax(0,1fr);min-width:0;gap:0;position:relative;align-items:stretch;border:1px solid #d8c4cd;background:#e5d9df;}
.duel-summary .duel-deck.many{grid-template-columns:repeat(auto-fit,minmax(min(100%,205px),1fr));gap:1px;}
.duel-summary .duel-deck.many .duel-divider{display:none;}
.duel-summary .duel-card{position:relative;min-width:0;display:flex;flex-direction:column;align-items:stretch;text-align:center;padding:clamp(12px,3.1vw,23px) clamp(9px,2.8vw,20px) clamp(14px,3.1vw,23px);}
.duel-summary .duel-card.is-a{background:linear-gradient(150deg,#821b38,#591228);color:#fff;}
.duel-summary .duel-card.is-b{background:linear-gradient(155deg,#fffefe,#f5f0f2);color:#35252c;}
.duel-summary .duel-card.is-other{background:#eae0e4;color:#30242b;}
.duel-summary .duel-card.is-winner{outline:2px solid #e9a1b4;outline-offset:-3px;}
.duel-summary .duel-card.is-b.is-winner{outline-color:#9c3453;}
.duel-summary .duel-role{font-size:clamp(10px,2vw,12px);font-weight:900;letter-spacing:1px;opacity:.72;}
.duel-summary .duel-name{margin:5px 0 0;font-size:clamp(15px,3.1vw,22px);font-weight:920;line-height:1.14;min-height:2.28em;display:flex;align-items:center;justify-content:center;overflow-wrap:anywhere;}
.duel-summary .duel-tally{margin-top:6px;display:block;font-size:clamp(51px,11vw,89px);font-weight:950;line-height:1.08;letter-spacing:-3px;font-variant-numeric:tabular-nums;}
.duel-summary .duel-tally-label{font-size:clamp(9px,2vw,11px);font-weight:900;letter-spacing:1px;opacity:.68;min-height:2.3em;}
.duel-summary .duel-win-flag{font-size:clamp(9px,1.95vw,11px);font-weight:900;letter-spacing:.65px;display:grid;place-items:center;min-height:27px;margin:5px 0 7px;color:inherit;}
.duel-summary .duel-card:not(.is-winner) .duel-win-flag{visibility:hidden;}
.duel-summary .duel-win-flag span{border:1px solid currentColor;padding:5px 9px;max-width:100%;overflow-wrap:anywhere;}
.duel-summary .duel-divider{position:relative;min-width:1px;background:#d7bdc7;z-index:1;}
.duel-summary .duel-divider span{position:absolute;left:50%;top:18%;transform:translate(-50%,-50%);font-size:10px;font-weight:950;background:#f6e9ef;color:#7a2440;border:1px solid #dcc3ce;border-radius:50%;display:grid;place-items:center;width:34px;height:34px;z-index:2;}
.duel-summary .duel-stat{border-top:1px solid rgba(255,255,255,.19);display:flex;flex-direction:column;gap:5px;padding:10px 2px;min-width:0;}
.duel-summary .duel-card.is-b .duel-stat,.duel-summary .duel-card.is-other .duel-stat{border-color:#e4d8df;}
.duel-summary .duel-stat small{font-size:clamp(9px,1.9vw,11px);font-weight:850;letter-spacing:.45px;opacity:.72;overflow-wrap:anywhere;}
.duel-summary .duel-stat strong{font-size:clamp(17px,3.7vw,26px);font-weight:900;line-height:1.05;overflow-wrap:anywhere;font-variant-numeric:tabular-nums;}
.duel-summary .duel-stat.main strong{font-size:clamp(31px,6.5vw,49px);letter-spacing:-1.2px;}
.duel-summary .duel-stat.main{padding-top:15px;padding-bottom:15px;}
.duel-summary .duel-muted{margin:2px 0 0;color:#dfbcc7;font-size:clamp(10px,2vw,12px);line-height:1.4;font-weight:650;}
.duel-summary .summary-footer{background:rgba(25,10,17,.97);border-top:1px solid #673746;}
.duel-summary .summary-footer button.secondary{background:#342730;color:#fff0f3;}
@media(max-width:365px){
 .duel-summary .duel-card{padding:10px 7px 14px;}
 .duel-summary .duel-tally{font-size:50px;}
 .duel-summary .duel-stat.main strong{font-size:29px;}
 .duel-summary .duel-stat strong{font-size:17px;}
 .duel-summary .duel-name{font-size:14px;}
 .duel-summary .duel-banner{padding:12px 11px;}
}
@media(min-width:800px) and (orientation:landscape){
 .duel-summary .summary-body{display:grid;grid-template-columns:minmax(225px,.72fr) minmax(0,1.28fr);gap:12px;align-items:start;align-content:start;}
 .duel-summary .duel-banner{grid-column:1;grid-row:1 / span 3;position:sticky;top:0;flex-direction:column;align-items:flex-start;}
 .duel-summary .duel-banner-score{align-items:flex-start;}
 .duel-summary .tourney-summary-heading,.duel-summary .duel-tabs,.duel-summary .duel-content,.duel-summary .duel-muted{grid-column:2;min-width:0;}
}
@media(min-width:800px) and (orientation:landscape){
  .duel-summary.is-event-summary .tourney-summary-heading{grid-column:1 / -1;grid-row:1;}
  .duel-summary.is-event-summary .duel-banner{grid-column:1;grid-row:2 / span 3;}
  .duel-summary.is-event-summary .duel-tabs{grid-column:2;grid-row:2;}
  .duel-summary.is-event-summary .duel-content{grid-column:2;grid-row:3;}
}
@media(max-height:430px) and (orientation:landscape){.duel-summary .summary-body{display:flex}.duel-summary .duel-banner{position:static;flex-direction:row}.duel-summary .duel-banner-score{align-items:flex-end}}


/* RESTPUNKTE: 10 zurückhaltende CSS-Entwürfe; nur in Statistik-Duell-Karte angewandt */
:is(.duel-summary,.rest-comparison) .rp-picker{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;margin:0 0 9px;min-width:0;max-width:100%;}
:is(.duel-summary,.rest-comparison) .rp-picker button{font-size:clamp(9px,2.15vw,11px);font-weight:800;line-height:1.2;font-family:inherit;min-width:0;min-height:37px;border:1px solid rgba(255,255,255,.16);background:#26242a;color:#dfd6db;padding:6px 3px;cursor:pointer;border-radius:4px;}
:is(.duel-summary,.rest-comparison) .rp-picker button.active{background:#73203b;border-color:#d6869d;color:#fff;}
:is(.duel-summary,.rest-comparison) .rp-picker button:focus-visible{outline:2px solid #fff;outline-offset:2px;}
:is(.duel-summary,.rest-comparison) .rp-panel{--rp-bg:#1a1b20;--rp-head:#24252b;--rp-ink:#f6f5f7;--rp-muted:#b5b4bf;--rp-line:rgba(255,255,255,.13);--rp-a-bg:rgba(140,30,62,.32);--rp-b-bg:rgba(255,255,255,.035);--rp-a-ink:#ffd4df;--rp-b-ink:#f9fafb;--rp-total-bg:rgba(255,255,255,.065);--rp-edge:rgba(255,255,255,.15);color:var(--rp-ink);background:var(--rp-bg);border:1px solid var(--rp-edge);border-radius:7px;overflow:hidden;margin:0;width:100%;max-width:100%;min-width:0;box-shadow:none;}
:is(.duel-summary,.rest-comparison) .rp-panel .tourney-rest-heading{padding:11px 12px;background:var(--rp-head);border:0;border-bottom:1px solid var(--rp-line);gap:8px;color:var(--rp-ink);}
:is(.duel-summary,.rest-comparison) .rp-panel .tourney-rest-heading h3{margin:0;color:var(--rp-ink);font-size:clamp(13px,2.8vw,17px);letter-spacing:.1px;}
:is(.duel-summary,.rest-comparison) .rp-panel .tourney-rest-heading span{color:var(--rp-muted);font-size:clamp(9px,2vw,11px);}
:is(.duel-summary,.rest-comparison) .rp-panel .tourney-rest-table-wrap{overflow:hidden;max-width:100%;padding:3px 7px 0;}
:is(.duel-summary,.rest-comparison) .rp-panel .tourney-rest-table{color:var(--rp-ink);width:100%;table-layout:fixed;border-collapse:collapse;font-size:clamp(10px,2.5vw,14px);font-variant-numeric:tabular-nums;}
:is(.duel-summary,.rest-comparison) .rp-panel .tourney-rest-table thead{background:transparent;}
:is(.duel-summary,.rest-comparison) .rp-panel .tourney-rest-table thead th{color:var(--rp-muted);font-size:clamp(8.7px,2.08vw,11px);font-weight:780;text-align:center;line-height:1.16;}
:is(.duel-summary,.rest-comparison) .rp-panel .tourney-rest-table th,:is(.duel-summary,.rest-comparison) .rp-panel .tourney-rest-table td{min-width:0;white-space:normal;overflow-wrap:anywhere;padding:10px clamp(2px,.75vw,7px);border:0;border-bottom:1px solid var(--rp-line);background:transparent;color:var(--rp-ink);text-align:center;}
:is(.duel-summary,.rest-comparison) .rp-panel .tourney-rest-table th:first-child{width:27%;text-align:left;padding-left:6px;}
:is(.duel-summary,.rest-comparison) .rp-panel .tourney-rest-table tbody th{font-size:clamp(9px,2.2vw,12px);font-weight:850;line-height:1.15;}
:is(.duel-summary,.rest-comparison) .rp-panel .tourney-rest-table tbody tr.rp-a th{color:var(--rp-a-ink);}
:is(.duel-summary,.rest-comparison) .rp-panel .tourney-rest-table tbody tr.rp-b th{color:var(--rp-b-ink);}
:is(.duel-summary,.rest-comparison) .rp-panel .tourney-rest-table tbody tr:nth-child(odd){background:transparent;}
:is(.duel-summary,.rest-comparison) .rp-panel .tourney-rest-table tbody tr:nth-child(even){background:rgba(255,255,255,.035);}
:is(.duel-summary,.rest-comparison) .rp-panel .tourney-rest-table tbody tr:last-child th,:is(.duel-summary,.rest-comparison) .rp-panel .tourney-rest-table tbody tr:last-child td{border-bottom:0;}
:is(.duel-summary,.rest-comparison) .rp-panel .tourney-rest-value{display:inline;padding:0;min-width:0;background:none!important;color:inherit!important;font-weight:650;font-size:inherit;border:0;border-radius:0;}
:is(.duel-summary,.rest-comparison) .rp-panel .tourney-rest-value.is-zero{font-weight:900;}
:is(.duel-summary,.rest-comparison) .rp-panel .tourney-rest-sum{background:var(--rp-total-bg)!important;color:var(--rp-ink);font-weight:900;}
:is(.duel-summary,.rest-comparison) .rp-panel p{padding:9px 12px;border-top:1px solid var(--rp-line);font-size:clamp(9px,2.15vw,11px);line-height:1.35;color:var(--rp-muted);margin:0;}
:is(.duel-summary,.rest-comparison) .rp-panel .tourney-rest-zero-key{padding:0;border:0;background:none;color:inherit;font-weight:850;}

/* 01 — Pure Anthrazit */
:is(.duel-summary,.rest-comparison) .rp-panel[data-rp="1"]{--rp-bg:#202126;--rp-head:#282a30;--rp-edge:#505057;}
:is(.duel-summary,.rest-comparison) .rp-panel[data-rp="1"] .tourney-rest-table tbody tr.rp-a{background:rgba(127,22,50,.16);}
/* 02 — Zeilen-Karten */
:is(.duel-summary,.rest-comparison) .rp-panel[data-rp="2"]{--rp-bg:#1b1c21;--rp-head:#1b1c21;--rp-edge:#47494f;}
:is(.duel-summary,.rest-comparison) .rp-panel[data-rp="2"] .tourney-rest-table{border-collapse:separate;border-spacing:0 6px;}
:is(.duel-summary,.rest-comparison) .rp-panel[data-rp="2"] .tourney-rest-table tbody tr{background:#2b2d32;}
:is(.duel-summary,.rest-comparison) .rp-panel[data-rp="2"] .tourney-rest-table tbody tr.rp-a{background:#45232f;}
:is(.duel-summary,.rest-comparison) .rp-panel[data-rp="2"] .tourney-rest-table tbody th,:is(.duel-summary,.rest-comparison) .rp-panel[data-rp="2"] .tourney-rest-table tbody td{border-bottom:0;padding-top:12px;padding-bottom:12px;}
:is(.duel-summary,.rest-comparison) .rp-panel[data-rp="2"] .tourney-rest-table tbody tr>*:first-child{border-radius:5px 0 0 5px;}
:is(.duel-summary,.rest-comparison) .rp-panel[data-rp="2"] .tourney-rest-table tbody tr>*:last-child{border-radius:0 5px 5px 0;}
/* 03 — Linien-Akzent */
:is(.duel-summary,.rest-comparison) .rp-panel[data-rp="3"]{--rp-bg:#1e1f23;--rp-head:#28282e;--rp-edge:#4a4a50;}
:is(.duel-summary,.rest-comparison) .rp-panel[data-rp="3"] .tourney-rest-table tbody tr.rp-a th{border-left:3px solid #d74872;}
:is(.duel-summary,.rest-comparison) .rp-panel[data-rp="3"] .tourney-rest-table tbody tr.rp-b th{border-left:3px solid #dfe1e5;}
:is(.duel-summary,.rest-comparison) .rp-panel[data-rp="3"] .tourney-rest-table tbody tr th{padding-left:8px;}
/* 04 — Header-Band */
:is(.duel-summary,.rest-comparison) .rp-panel[data-rp="4"]{--rp-bg:#232329;--rp-head:#353137;--rp-edge:#555159;}
:is(.duel-summary,.rest-comparison) .rp-panel[data-rp="4"] .tourney-rest-heading{border-bottom:2px solid #95445d;}
:is(.duel-summary,.rest-comparison) .rp-panel[data-rp="4"] .tourney-rest-table thead th{color:#ebdde3;font-weight:900;}
/* 05 — Minimal-Linien */
:is(.duel-summary,.rest-comparison) .rp-panel[data-rp="5"]{--rp-bg:transparent;--rp-head:transparent;--rp-edge:transparent;border-radius:0;}
:is(.duel-summary,.rest-comparison) .rp-panel[data-rp="5"] .tourney-rest-heading{padding-left:2px;padding-right:2px;}
:is(.duel-summary,.rest-comparison) .rp-panel[data-rp="5"] .tourney-rest-table-wrap{padding-left:0;padding-right:0;}
:is(.duel-summary,.rest-comparison) .rp-panel[data-rp="5"] .tourney-rest-table th,:is(.duel-summary,.rest-comparison) .rp-panel[data-rp="5"] .tourney-rest-table td{padding-top:14px;padding-bottom:14px;}
/* 06 — Summen-Fokus */
:is(.duel-summary,.rest-comparison) .rp-panel[data-rp="6"]{--rp-bg:#202126;--rp-head:#2a2b30;--rp-total-bg:#35343b;}
:is(.duel-summary,.rest-comparison) .rp-panel[data-rp="6"] .tourney-rest-table thead th:last-child{color:#fff;}
:is(.duel-summary,.rest-comparison) .rp-panel[data-rp="6"] .tourney-rest-table tbody td:last-child{font-size:clamp(12px,3.1vw,17px);border-left:1px solid rgba(255,255,255,.19);}
:is(.duel-summary,.rest-comparison) .rp-panel[data-rp="6"] .tourney-rest-table tbody tr.rp-a td:last-child{color:#ffcedd;}
/* 07 — Zweifarbiger Kontrast */
:is(.duel-summary,.rest-comparison) .rp-panel[data-rp="7"]{--rp-bg:#202025;--rp-head:#2a2a2f;}
:is(.duel-summary,.rest-comparison) .rp-panel[data-rp="7"] .tourney-rest-table tbody tr.rp-a{background:#46202e;}
:is(.duel-summary,.rest-comparison) .rp-panel[data-rp="7"] .tourney-rest-table tbody tr.rp-b{background:#34353b;}
:is(.duel-summary,.rest-comparison) .rp-panel[data-rp="7"] .tourney-rest-table tbody th{letter-spacing:.1px;}
/* 08 — Feine Streifen */
:is(.duel-summary,.rest-comparison) .rp-panel[data-rp="8"]{--rp-bg:#1c1d21;--rp-head:#26272b;}
:is(.duel-summary,.rest-comparison) .rp-panel[data-rp="8"] .tourney-rest-table tbody tr:nth-child(odd){background:rgba(255,255,255,.055);}
:is(.duel-summary,.rest-comparison) .rp-panel[data-rp="8"] .tourney-rest-table tbody tr:nth-child(even){background:rgba(255,255,255,.014);}
:is(.duel-summary,.rest-comparison) .rp-panel[data-rp="8"] .tourney-rest-table tbody tr.rp-a th{background:rgba(149,34,66,.22);}
/* 09 — Präzisionsraster */
:is(.duel-summary,.rest-comparison) .rp-panel[data-rp="9"]{--rp-bg:#1b1c22;--rp-head:#292a2e;--rp-line:rgba(255,255,255,.17);}
:is(.duel-summary,.rest-comparison) .rp-panel[data-rp="9"] .tourney-rest-table tbody td,:is(.duel-summary,.rest-comparison) .rp-panel[data-rp="9"] .tourney-rest-table tbody th{border:1px solid var(--rp-line);}
:is(.duel-summary,.rest-comparison) .rp-panel[data-rp="9"] .tourney-rest-table tbody tr.rp-a th{background:rgba(133,28,57,.25);}
:is(.duel-summary,.rest-comparison) .rp-panel[data-rp="9"] .tourney-rest-table tbody tr.rp-b th{background:rgba(255,255,255,.055);}
/* 10 — Soft-Matt */
:is(.duel-summary,.rest-comparison) .rp-panel[data-rp="10"]{--rp-bg:linear-gradient(145deg,#2b282f,#1c1d21 66%);--rp-head:linear-gradient(90deg,#312d34,#26252b);--rp-edge:rgba(255,255,255,.20);}
:is(.duel-summary,.rest-comparison) .rp-panel[data-rp="10"] .tourney-rest-table tbody tr.rp-a{background:rgba(117,30,58,.16);}
:is(.duel-summary,.rest-comparison) .rp-panel[data-rp="10"] .tourney-rest-table tbody tr.rp-b{background:rgba(255,255,255,.035);}
@media(max-width:340px){:is(.duel-summary,.rest-comparison) .rp-picker{grid-template-columns:repeat(5,minmax(0,1fr));}:is(.duel-summary,.rest-comparison) .rp-panel .tourney-rest-table th:first-child{width:24%;}}



/* RESPONSIVE STUDIE – NUR GRÖSSEN UND ANORDNUNG.
   Alle bestehenden Farbtöne, Effekte, Kachelformen und Spielfunktionen bleiben unangetastet. */
@supports (height:100dvh) {
  html,body {height:100dvh;}
  #app {height:100dvh;}
}
.screen, .screen > *, .page-body, .p4-main, .p5-main,
.g-pad, .g-numbers, .summary-body {min-width:0;}
/* Beim Tablet-/Desktop-Browser hat das originale Startmenü eine angenehme
   Bedienbreite statt sich über 1600px Bildschirmbreite zu strecken. */
@media (min-width:760px) and (min-height:540px) {
  .home-screen .brand {
    align-self:center;
    margin-left:auto;
    margin-right:auto;
  }
  .home-screen .home-menu {
    width:min(100% - 54px, 740px);
    align-self:center;
    margin-left:auto;
    margin-right:auto;
  }
  .home-screen .menu-item {max-width:100%;}
}
/* Flache Querformate: Das existierende Menü wird nur kompakter skaliert.
   Es bleiben dieselben fünf Kacheln, ihre Farben und ihre Icons. */
@media (orientation:landscape) and (max-height:540px) {
  .home-screen .brand {
    align-self:center;
    margin:clamp(5px,1.4dvh,12px) auto 0;
    gap:7px;
  }
  .home-screen .brand-mark {width:clamp(36px,10dvh,58px);height:clamp(36px,10dvh,58px);}
  .home-screen .brand-text .brand-first {font-size:clamp(15px,4dvh,21px);}
  .home-screen .brand-text .brand-last {font-size:clamp(17px,4.7dvh,24px);}
  .home-screen .home-menu {
    width:min(100% - 30px,680px);
    align-self:center;
    min-height:0;
    max-height:calc(100% - 70px);
    margin:auto auto max(clamp(4px,1.4dvh,10px),env(safe-area-inset-bottom));
    overflow-y:auto;
    scrollbar-width:thin;
  }
  .home-screen .home-menu .menu-item {height:clamp(34px,10.5dvh,48px);min-height:34px;grid-template-columns:clamp(28px,5dvh,38px) minmax(0,1fr) 28px;gap:8px;padding:0 12px;}
  .home-screen .menu-icon {height:clamp(19px,5dvh,27px);width:clamp(19px,5dvh,27px);}
  .home-screen .menu-copy strong {font-size:clamp(10px,3.3dvh,15px);}
  .home-screen .menu-copy small {font-size:clamp(9px,2.6dvh,12px);line-height:1.1;}
  .home-screen .menu-chevron {height:25px;width:25px;}
  .home-screen .menu-chevron svg{height:15px;width:15px;}
}
/* Mehr Breite im Scorer wird nicht als Bild gestreckt: die originalen
   zwei Spielerflächen, drei Dart-Kacheln und das Eingaberaster bleiben erhalten. */
@media (orientation:landscape) and (min-width:900px) and (min-height:540px) {
  .match-screen .g-top {height:clamp(58px,8dvh,80px);}
  .match-screen .g-board {height:clamp(170px,27dvh,270px);}
  .match-screen .g-darts {height:clamp(76px,12dvh,110px);}
  .match-screen .g-pad {grid-template-rows:minmax(0,1fr) clamp(53px,9.5dvh,90px);}
  .match-screen .g-player-head {font-size:clamp(12px,1.6dvh,18px);}
  .match-screen .g-score {font-size:clamp(54px,9.5dvh,96px);}
  .match-screen .g-name {font-size:clamp(20px,3.6dvh,34px);}
  .match-screen .g-dart-main {font-size:clamp(31px,5dvh,48px);}
  .match-screen .g-key {font-size:clamp(17px,3.7dvh,31px);}
  .match-screen .g-ring {font-size:clamp(16px,2.4dvh,24px);}
}
/* Sehr niedrige Browserfenster, besonders Smartphone im Querformat:
   Höhe statt Breite ist die Engstelle. */
@media (orientation:landscape) and (max-height:460px) {
  .match-screen .g-top {height:clamp(35px,9.8dvh,45px);padding-left:9px;padding-right:9px;}
  .match-screen .g-center .g-title {font-size:clamp(18px,5dvh,24px);}
  .match-screen .g-center .g-sub {font-size:clamp(8px,2.2dvh,10px);}
  .match-screen .g-round {font-size:clamp(9px,2.4dvh,12px);}
  .match-screen .g-board {height:clamp(82px,26dvh,122px);}
  .match-screen .g-player-head {top:4px;font-size:clamp(9px,2.8dvh,12px);}
  .match-screen .g-score {font-size:clamp(30px,9dvh,43px);margin:7px 0 0;}
  .match-screen .g-name {font-size:clamp(12px,3.8dvh,17px);margin-top:2px;}
  .match-screen .g-darts {height:clamp(49px,14dvh,64px);padding:3px 8px;gap:6px;}
  .match-screen .g-dart {padding:2px 5px;}
  .match-screen .g-dart-head{font-size:clamp(8px,2dvh,10px);}
  .match-screen .g-dart-main {font-size:clamp(17px,6dvh,27px);}
  .match-screen .g-dart-sub {font-size:clamp(8px,2.2dvh,11px);}
  .match-screen .g-pad {grid-template-rows:minmax(0,1fr) clamp(31px,9.5dvh,42px);}
  .match-screen .g-key{font-size:clamp(12px,3.8dvh,19px);}
  .match-screen .g-ring{font-size:clamp(12px,3.6dvh,17px);}
  .match-screen .g-settings{height:31px;width:31px;font-size:23px;}
  .match-screen .g-undo{font-size:clamp(18px,5dvh,26px);}
}
/* Tabellen und Spieler-Auswahl: keine Änderung an Typografie/Farben,
   nur sichere Breiten bei schmalen Browserfenstern. */
.summary-body, .tourney-scroll, .events-body, .rb-options-body,
.p4-tiles, .p5-list, .summary-detail-players, .tourney-rest-table-wrap {max-width:100%;}
@media (max-width:380px) {
  .duel-summary .tourney-rest-table {table-layout:fixed;width:100%;}
}



/* ===========================================
   DESIGN-AUDIT: Einheitliche Navigationsfarben
   Farbton direkt von den bestehenden Startmenü-Kacheln übernommen.
   Ausschließlich gewöhnliche Navigations-/Aktiv-/Weiter-Flächen.
   Keine Änderungen an Event-Kacheln/-Phasen, Event-Spielerauswahl,
   Scorer, Dart-Kacheln, Spieler A/B oder Restpunkte-Design 05.
   =========================================== */
:root {
  --rd-nav-home:linear-gradient(90deg,rgba(178,15,39,.63),rgba(131,4,21,.75));
  --rd-nav-selected:linear-gradient(95deg,rgba(184,20,47,.98),rgba(130,6,29,.98));
  --rd-nav-primary:linear-gradient(180deg,#b71936,#850a21);
  --rd-nav-border:rgba(240,151,168,.38);
  --rd-nav-hover:linear-gradient(90deg,rgba(199,25,55,.88),rgba(148,7,34,.92));
}
/* Gleiche Kachel-Optik wie STARTSEITE für normale Menü-Navigation. */
.screen:not(.rebstock-event-screen):not([aria-label^="Events"]) .mode-button:not(:disabled),
.screen:not(.rebstock-event-screen):not([aria-label^="Events"]) .rb-hub-link,
.screen:not(.rebstock-event-screen):not([aria-label^="Events"]) .rb-stats-person,
.screen:not(.rebstock-event-screen):not([aria-label^="Events"]) .pm-player,
.screen:not(.rebstock-event-screen):not([aria-label^="Events"]) .pm-add-panel {
  background:var(--rd-nav-home);
  border-color:var(--rd-nav-border);
}
.screen:not(.rebstock-event-screen) .mode-button:not(:disabled):active,
.screen:not(.rebstock-event-screen) .rb-hub-link:active,
.screen:not(.rebstock-event-screen) .rb-stats-person:active,
.screen:not(.rebstock-event-screen) .pm-player:active {
  background:var(--rd-nav-hover);
}
/* Gewählte Optionen zeigen dasselbe Rebstock-Rot – nicht Hellrosa oder Grauweiß. */
.screen:not(.rebstock-event-screen) .x01-choice[aria-pressed="true"],
.screen:not(.rebstock-event-screen) .p4-tile[aria-pressed="true"],
.screen:not(.rebstock-event-screen) .rb-option-choice[aria-pressed="true"],
.screen:not(.rebstock-event-screen) .stats-tabs button.active,
.screen:not(.rebstock-event-screen):not(.is-event-summary) .duel-tabs button.active,
.screen:not(.rebstock-event-screen):not(.is-event-summary) .duel-selector button.active {
  background:var(--rd-nav-selected);
  color:#fff;
  border-color:var(--rd-nav-border);
}
/* Bestätigen, weiter, speichern: derselbe Grundton in deckender Form. */
.screen:not(.rebstock-event-screen) .x01-next,
.screen:not(.rebstock-event-screen) .p4-start,
.screen:not(.rebstock-event-screen) .p4-save,
.screen:not(.rebstock-event-screen) .pm-save,
.screen:not(.rebstock-event-screen) .back-main,
.screen:not(.rebstock-event-screen):not(.is-event-summary) .summary-footer button:not(.secondary) {
  background:var(--rd-nav-primary);
  color:#fff;
  border-color:var(--rd-nav-border);
}
/* Dezentere sekundäre Zurück-Aktionen, Scorer-Tastatur bleibt unverändert. */
.screen:not(.rebstock-event-screen) .page-top:not(.flow-top) .back {
  background:rgba(131,4,21,.48);
}


/* V26 HTML-Vorschau: Klarweiß statt pastelligem Rosa, Grundrot statt Lila.
   Event-Designs bewusst unangetastet; Spieler A bleibt rot, Spieler B weiß. */
:root{--ink:#fff;--muted:#fff;}
/* Lesbare, klare Sekundärtexte auf den regulären dunkelroten Seiten. */
.screen:not(.rebstock-event-screen):not(.event-flow-screen) :is(
 .menu-copy small,.mode-copy small,.mode-footnote,.mode-button:disabled .mode-copy small,
 .x01-subtitle,.x01-nextnote,.p4-hdesc,.p4-info,.p4-footnote,.p4-no-players,
 .pm-sub,.pm-count,.pm-person small,.pm-note,.pm-profile-heading small,
 .pm-metric span,.rb-hub-copy small,.rb-stats-desc,.rb-stats-head p,
 .rb-stats-count,.rb-stats-metrics,.rb-stats-note,.rb-results-date,
 .rb-stat-detail-title small,.rb-stat-detail-title p,.rb-stat-detail-value span,
 .rb-stat-detail-match .date,.rb-stat-detail-note,.rb-options-card p,
 .rb-option-meta small,.rb-options-tip
 ){color:#fff;}
/* Helle neutrale Eingaben statt rosastichiger Flächen. */
.screen:not(.event-flow-screen) .x01-stepper button,
.screen:not(.event-flow-screen) .p5-move{background:#fff;color:#490514;}
.screen:not(.event-flow-screen) .pm-input{background:#fff;color:#2b1f23;}
/* Scorer-Tastatur und Trägerflächen reinweiß statt Altrosa. */
.match-screen .g-top{background:#fff;border-bottom-color:#e5e5e5;}
.match-screen .g-darts{background:#fff;}
.match-screen .g-pad{background:#fff;}
.match-screen .g-key,.match-screen .g-key:nth-child(even){background:#fff!important;color:#241d20!important;}
.match-screen .g-key.g-special,.match-screen .g-key.g-undo{background:#eee!important;color:#5c0b1d!important;}
.match-screen .g-ring{background:#f5f5f5;color:#5c0b1d;}
.match-screen .g-hint{background:#fff;}
.match-screen .g-actions button.secondary{background:#f5f5f5;}
.match-screen .g-player:not(.current),.match-screen .g-player.current{color:#fff;}
.match-screen .g-player-head,.match-screen .g-player.current .g-player-head,.match-screen .g-dart-head{color:#fff;}
.match-screen .g-dart.current{border-color:#fff;}
.match-screen .g-dart.current .g-dart-sub{color:rgba(255,255,255,.80);}
/* Matchstatistik: ersetzt violett/mauve durch die rote Startseiten-Palette. */
.duel-summary{background:linear-gradient(155deg,#230408 0%,#46050d 60%,#5b0b19 100%);}
.duel-summary .summary-head{background:linear-gradient(90deg,#a41732,#74051b);border-bottom-color:rgba(255,255,255,.20);}
.duel-summary .duel-banner{
  background:var(--rd-nav-home);border-top:3px solid #bc2543;
  border-bottom:1px solid rgba(255,255,255,.26);color:#fff;
}
.duel-summary :is(.duel-overline,.duel-banner-name,.duel-banner-caption,.duel-banner-score strong,.duel-banner-score span){color:#fff;}
.duel-summary .duel-tabs{background:rgba(26,20,22,.90);border-color:rgba(255,255,255,.28);}
.duel-summary .duel-tabs button{color:#fff;}
.duel-summary .duel-tabs button.active{background:var(--rd-nav-selected);color:#fff;border-color:var(--rd-nav-border);}
.duel-summary .duel-context :is(h2,small){color:#fff;}
.duel-summary .duel-selector button{background:#242226;color:#fff;border:1px solid rgba(255,255,255,.24);}
.duel-summary .duel-selector button.active{background:var(--rd-nav-selected);border-color:rgba(255,255,255,.70);color:#fff;box-shadow:none;}
.duel-summary .duel-leg-highlight{background:#242226;border-left-color:#a71934;color:#fff;}
.duel-summary .duel-leg-highlight strong{color:#fff;}
.duel-summary .duel-deck{background:#393538;border-color:rgba(255,255,255,.38);}
.duel-summary .duel-deck .duel-divider{background:#686367;}
.duel-summary .duel-divider span{background:#222;color:#fff;border-color:#777;}
.duel-summary .duel-card.is-a{background:linear-gradient(150deg,#a01935,#65091f);color:#fff;}
.duel-summary .duel-card.is-b{background:#fff;color:#252025;}
.duel-summary .duel-card.is-other{background:#eee;color:#252025;}
.duel-summary .duel-card.is-winner{outline-color:#fff;}
.duel-summary .duel-card.is-b.is-winner{outline-color:#95122b;}
.duel-summary .duel-card.is-b :is(.duel-stat,.duel-win-flag span){border-color:#ccc;}
.duel-summary .duel-muted{color:#fff;}
.duel-summary .summary-footer{background:rgba(36,10,16,.97);border-color:rgba(255,255,255,.2);}
.duel-summary .summary-footer button.secondary{background:#282528;color:#fff;}
/* Gewähltes Restpunkte-Design 05 bleibt ein reduziertes, dunkles Linienlayout.
   Spieler A ist weiterhin durch seine rote Spielerkachel erkennbar. */
.duel-summary .rp-panel{--rp-a-ink:#fff;--rp-b-ink:#fff;--rp-ink:#fff;--rp-muted:#fff;}
.duel-summary .rp-panel .tourney-rest-table tbody tr.rp-a th{color:#fff;}
/* Weitere neutrale Standardtexte auf dunklen Flächen – keine Pastell-Rosa-Schrift. */
.screen:not(.rebstock-event-screen):not(.event-flow-screen) :is(
 .mode-soon,.x01-choice,.p4-count,.p4-ordnum,.p4-no-players,
 .p5-index,.stats-placeholder,.stats-tabs button,.pm-expand,
 .pm-rename small,.pm-delete-trigger,.rb-results-type,.rb-results-score,
 .rb-stats-empty,.rb-stat-detail-match .date,.rb-option-choice,

/* Korrektur: Auch im ersten Dart leuchtet die gedrueckte Taste sofort rot und

.match-screen .g-numbers {

  function buildSetLog(g){
    if(g.config.duration!=='Set')return [];
    const groups=[];
    for(const leg of g.legLog){
      let set=groups.find(group=>group.number===leg.set);
      if(!set){
        set={number:leg.set,legs:0,winner:null,winnerId:null,players:g.players.map(p=>({
          id:p.id,name:p.name,darts:0,scored:0,bestVisit:0,bestFinish:0,
          doubleAttempts:0,doubleHits:0,legsWon:0
        }))};
        groups.push(set);
      }
      set.legs++;
      if(leg.setWon){set.winner=leg.winner;set.winnerId=leg.winnerId;}
      for(const p of leg.players){
        const total=set.players.find(x=>x.id===p.id);
        if(!total)continue;
        total.darts+=p.darts;total.scored+=p.scored;
        total.bestVisit=Math.max(total.bestVisit,p.bestVisit);
        total.bestFinish=Math.max(total.bestFinish,p.bestFinish);
        total.doubleAttempts+=p.doubleAttempts;total.doubleHits+=p.doubleHits;
        if(p.won)total.legsWon++;
      }
    }
    return groups;
  }

  function duelCard(p,i,scope,won=false,tally=0){
    const whole=scope==='total';

    const scored=whole?p.matchScored:p.scored;
    const finish=p.bestFinish||'–';
    const doubleRate=doubleText(p.doubleAttempts,p.doubleHits);
    const rest=!whole&&scope==='leg'&&Number.isFinite(p.rest)?p.rest:null;
    const label=scope==='set'?'LEGS IM SET':scope==='leg'?'LEG GEWONNEN':(demoGame&&demoGame.config.duration==='Set'?'SETS':'LEGS');
    const fields=[
      ['3-DART-AVERAGE',avgText(darts||0,scored||0).replace('.',','),'main'],

      ['BESTE AUFNAHME',String(p.bestVisit||'–'),''],
      ['HÖCHSTES FINISH',String(finish),''],
      ['DOPPELQUOTE',String(doubleRate),''],
      ...(whole?[['LEGS GEWONNEN',String(p.legsWon||0),'']]:scope==='leg'?[['RESTPUNKTE',rest===null?'–':String(rest),'']]:[])
    ];

  function playerStatDetailPage(id){
    const p=p4Player(id);
    if(!p){window.location.hash='/player-stats';return;}
    const t=playerTotals[String(id)]||null;
    const played=t?.matches||0;
    const wins=t?.wins||0;
    const losses=t?.losses||0;
    const metrics=[
      ['SPIELE',played],['SIEGE',wins],['NIEDERLAGEN',losses],
      ['AVERAGE',played?avgText(t.darts,t.scored):'–'],
      ['DOPPELQUOTE',played?doubleText(t.doubleAttempts,t.doubleHits):'–'],
      ['BESTE AUFNAHME',t?.bestVisit||'–'],
      ['HÖCHSTES FINISH',t?.bestFinish||'–'],
      ['BESTES LEG',t?.bestLeg?t.bestLeg+' Darts':'–']
    ];
    const matches=matchHistory.filter(m=>Array.isArray(m.players)&&m.players.some(x=>x.id===id)).slice(0,5);
    const rows=matches.map(m=>{
      const other=m.players.filter(x=>x.id!==id).map(x=>x.name).join(', ')||'Match';
      const won=m.winnerId===id;
      const d=new Date(m.date);
      const when=Number.isNaN(d.getTime())?'':d.toLocaleDateString('de-DE');
      return '<div class="rb-stat-detail-match"><span class="who">gegen '+p4escape(playerNameUpper(other))+'</span><small class="date">'+p4escape(when)+'</small><strong class="result">'+(won?'Sieg':'Niederlage')+'</strong></div>';
    }).join('');
    app.innerHTML='<main class="screen" aria-label="Statistik von '+p4escape(playerNameUpper(p.name))+'">'+flowHeader('Spieler-Statistik','player-stats')+
      '<section class="rb-stat-detail-body"><div class="rb-stat-detail-col">'+
      '<div class="rb-stat-detail-title"><small>SPIELER-STATISTIK · AUSWERTUNG</small><h2>'+p4escape(playerNameUpper(p.name))+'</h2><p>Alle Werte sind schreibgeschützt.</p></div>'+
      '<div class="rb-stat-detail-scroll">'+
      '<section class="rb-stat-detail-section"><h3>GESAMTWERTE</h3><div class="rb-stat-detail-grid">'+
      metrics.map(([label,value])=>'<div class="rb-stat-detail-value"><span>'+label+'</span><strong>'+value+'</strong></div>').join('')+
      '</div></section>'+
      '<section class="rb-stat-detail-section"><h3>LETZTE MATCHES</h3>'+

      '<p class="rb-stat-detail-note">Statistiken werden nach einem abgeschlossenen Match aktualisiert. Spielernamen lassen sich ausschließlich unter „Spieler verwalten“ ändern.</p>'+

  function resultsPage(){
    const recent=matchHistory.slice(0,25);
    const cards=recent.map(m=>{
      const config=m.config||{};
      const when=new Date(m.date);
      const date=Number.isNaN(when.getTime())?'Datum unbekannt':when.toLocaleString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
      const type=config.duration==='Set'?'Best of '+config.sets+' Sets':'First to '+(config.firstTo||1)+' Legs';
      const score=(Array.isArray(m.players)?m.players:[]).map(p=>'<span class="rb-results-score">'+p4escape(playerNameUpper(p.name))+' <b>'+
        Number(config.duration==='Set'?p.sets:p.legs)+' '+(config.duration==='Set'?'S':'L')+'</b></span>').join('');
      return '<article class="rb-results-card"><div class="rb-results-top"><span class="rb-results-date">'+p4escape(date)+'</span><span class="rb-results-type">'+p4escape((config.points||501)+' · '+type)+'</span></div>'+
        '<div class="rb-results-winner">🏆 '+p4escape(m.winner?playerNameUpper(m.winner):'Match beendet')+'</div>'+
        '<div class="rb-results-scores">'+score+'</div>'+(m.eventPhase==='group'?'<small class="rb-results-type">Gruppenphase · Restpunkte: '+(m.players||[]).map(p=>p4escape(playerNameUpper(p.name))+' '+(m.legLog||[]).reduce((sum,l)=>sum+(l.players?.find(x=>x.id===p.id)?.rest||0),0)).join(' · ')+'</small>':'')+'</article>';

  function playerProfilePage(id){
    const p=p4Player(id);

    const t=playerTotals[String(id)]||null;
    const played=t?t.matches||0:0;

    if(route==='match-preview'&&guardStillPresent)return false;

    }
  },true);
  window.addEventListener('hashchange',render);
  let lastWidePadMode=isTabletWidePad();
  window.addEventListener('resize',()=>{
    if(!app.querySelector('.match-screen'))return;
    const wide=isTabletWidePad();
    if(wide!==lastWidePadMode){lastWidePadMode=wide;renderDemoGame();}
    else fitTabletSquareKeys();
  },{passive:true});
  render();
})();
</script>
</body></html>
